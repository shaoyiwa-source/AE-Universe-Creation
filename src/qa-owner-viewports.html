<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internal responsive QA</title><style>body{margin:0;background:#bbb;font:14px sans-serif}header{height:44px;display:flex;align-items:center;gap:14px;padding:0 14px}iframe{display:block;margin:0 auto;border:0;background:#090b0a}button{padding:6px 12px}</style><header><label>Viewport <select id="size"><option value="320,568">320 × 568</option><option value="390,844">390 × 844</option><option value="1440,900">1440 × 900</option></select></label><button id="home">Home</button><output id="result">Internal QA, not a product route</output></header><iframe id="preview" title="Exact same deployment responsive viewport" width="320" height="568" src="/"></iframe><script>const f=document.getElementById('preview');document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');f.width=w;f.height=h;f.src='/';};document.getElementById('home').onclick=()=>f.src='/';</script></html>
