<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>盛明 Eternal Sun · 精裝版 Premium Edition · AE Universe Creation</title>
<link rel="stylesheet" href="./assets/premium.css">
</head>
<body>
<div id="stage" aria-label="盛明 Eternal Sun 精裝版動態桌布">
  <canvas id="back" aria-hidden="true"></canvas>
  <div id="art">
    <img id="painting" src="/assets/eternal-sun-canonical-1110x1536.jpg" alt="盛明 Eternal Sun — original painting" draggable="false">
    <canvas id="look" aria-hidden="true"></canvas>
    <canvas id="rgb" aria-hidden="true"></canvas>
  </div>
  <canvas id="front" aria-hidden="true"></canvas>
</div>
<div id="hint" data-zh="點畫作互動 · 雙指縮放 · ⚙ 設定" data-en="Tap the art · pinch to zoom · ⚙ settings"></div>
<button id="open" aria-label="settings" title="設定 / Settings">⚙</button>
<button id="zreset" hidden aria-label="reset zoom" data-zh="⟲ 還原大小" data-en="⟲ Reset zoom"></button>
<header id="brand"><a href="/" data-zh="AE UNIVERSE CREATION" data-en="AE UNIVERSE CREATION"></a><span id="title" data-zh="盛明 · 精裝版" data-en="Eternal Sun · Premium"></span></header>
<nav id="panel" aria-label="controls" hidden>
  <button id="close" aria-label="close" title="關閉 / Close">✕</button>
  <div class="row presets">
    <span class="lab" data-zh="模式" data-en="Preset"></span>
    <button class="pr on" data-p="golden" data-zh="金色綻放" data-en="Golden bloom"></button>
    <button class="pr" data-p="gallery" data-zh="畫廊燈" data-en="Gallery light"></button>
    <button class="pr" data-p="breath" data-zh="柔光呼吸" data-en="Soft breathing"></button>
    <button class="pr" data-p="stage" data-zh="RGB 舞台" data-en="RGB stage"></button>
    <button class="pr" data-p="club" data-zh="夜店雷射" data-en="Club lasers"></button>
    <button class="pr" data-p="gem" data-zh="寶石 Gem" data-en="Gem"></button>
    <button class="pr reset" data-p="lights" data-zh="只留燈光" data-en="Lighting only"></button>
    <button id="adv" class="advbtn" aria-expanded="false" data-zh="進階 ›" data-en="Advanced ›"></button>
  </div>
  <div class="row prog"><span id="tcur">0:00</span><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="song position"><span id="tdur">0:00</span></div>
  <div class="row keeprow">
    <button id="play" class="keep" data-zh="▶ 播放音樂" data-en="▶ Play music"></button>
    <div class="seg" role="group"><button id="mNat" class="on" data-zh="自然" data-en="Natural"></button><button id="mRgb" data-zh="三色照畫" data-en="RGB light"></button></div>
    <button id="lang">EN</button>
  </div>
  <div class="row lamps" id="lamps" hidden>
    <span class="lab" data-zh="燈色" data-en="Lamp"></span>
    <button class="lp on" data-c="auto" data-zh="自動輪替" data-en="Auto cycle"></button>
    <button class="lp" data-c="red" data-zh="紅" data-en="Red"></button>
    <button class="lp" data-c="green" data-zh="綠" data-en="Green"></button>
    <button class="lp" data-c="blue" data-zh="藍紫" data-en="Blue-violet"></button>
  </div>
  <div class="row lamps" id="styles">
    <span class="lab" data-zh="燈具" data-en="Fixture"></span>
    <button class="st on" data-s="bar" data-zh="畫燈條" data-en="Light bar"></button>
    <button class="st" data-s="spot" data-zh="三盞射燈" data-en="3 spots"></button>
    <button class="st" data-s="wash" data-zh="柔光" data-en="Soft wash"></button>
  </div>
  <div class="row">
    <label><span data-zh="強度" data-en="Intensity"></span><input id="int" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  </div>
  <div class="row toggles">
    <button class="tg" data-k="laser" data-zh="雷射光" data-en="Laser"></button>
    <button class="tg on" data-k="frame" data-zh="畫框" data-en="Frame"></button>
    <button class="tg on" data-k="led" data-zh="燈帶" data-en="LED"></button>
    <button class="tg on" data-k="aura" data-zh="光環" data-en="Aura"></button>
    <button class="tg on" data-k="glint" data-zh="閃光" data-en="Glints"></button>
    <button id="burst" class="tg2 on" aria-pressed="true" data-zh="✦ 綻放" data-en="✦ Bloom"></button>
    <button id="orig" aria-pressed="false" data-zh="原畫" data-en="Original art"></button>
  </div>
  <p class="note" id="engine"></p>
</nav>
<audio id="music" src="/player/eternal-sun/assets/ae-eternal-stream.m4a" preload="metadata" loop crossorigin="anonymous"></audio>
<script src="/player/eternal-sun/assets/ae-home-light-energy.js"></script>
<script src="/player/eternal-sun/assets/ae-home-beats.js"></script>
<script src="./assets/looks.js"></script>
<script src="/ae-chime.js"></script>
<script type="module" src="./assets/premium.js"></script>
</body>
</html>
