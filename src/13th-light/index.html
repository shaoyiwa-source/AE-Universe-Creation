<meta property="og:title" content="第13道光 The 13th Light">
<meta property="og:description" content="13 幅會發光的畫。12 月 1 日開幕，現在來可以先拿桌布。">

<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--mist:#ECEDEA;--raised:#F6F6F3;--ink:#23262A;--mute:#646A72;--rule:#D6D7D2;--sun:#E5483B;--leaf:#22A447;--water:#2B8BD6;--gold:#F2B33D;
--sans:"Albert Sans","Noto Sans TC",system-ui,sans-serif;--serif:"Noto Serif TC",serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--mist);scroll-behavior:smooth;overflow-x:hidden}
body{position:relative;color:var(--ink);font:400 16px/1.75 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--water);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer,section{position:relative;z-index:1}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,5vw,48px)}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,4vw,36px);background:rgba(236,237,234,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:8px;font:700 16px var(--serif);text-decoration:none;white-space:nowrap}
.brand svg{width:28px;height:28px}
.bar .r{display:flex;align-items:center;gap:8px}
.chip{border:1px solid var(--rule);background:var(--raised);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.lights{display:flex;gap:4px;align-items:center;cursor:pointer;border:0;background:none;padding:6px}
.lights i{width:7px;height:7px;border-radius:50%;background:var(--rule);transition:background .6s,box-shadow .6s}
.lights i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
@media(max-width:560px){.lights i{width:5px;height:5px;gap:3px}.brand span{display:none}}

/* hero */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:110px 20px 60px}
.hero .mark{width:76px;height:76px;margin-bottom:22px}
.hero h1{font:700 clamp(56px,12vw,128px)/1.05 var(--serif);letter-spacing:.08em}
.hero .en{font:500 clamp(18px,2.6vw,26px) var(--sans);color:var(--mute);margin-top:8px}
.hero .lead{max-width:30em;margin:28px auto 0;font-size:clamp(16px,2vw,19px)}
.count{display:flex;gap:clamp(14px,4vw,34px);justify-content:center;margin-top:34px}
.count div{min-width:64px}
.count b{display:block;font:700 clamp(32px,6vw,52px)/1 var(--serif);font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--mute)}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:36px;border:0;border-radius:999px;padding:15px 28px;background:var(--ink);color:#fff;font:600 16px var(--sans);cursor:pointer;box-shadow:0 10px 30px rgba(35,38,42,.18)}
.cta.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--ink)}
.ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.proof{margin-top:22px;font-size:14px;color:var(--mute)}
.scrollhint{margin-top:46px;font-size:13px;color:var(--mute);animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(6px)}}

/* early gifts */
.gifts{padding:clamp(60px,10vw,120px) 0}
.gifts h2,.wall h2{font:700 clamp(28px,4.4vw,44px)/1.3 var(--serif);letter-spacing:.04em;margin-bottom:10px}
.gifts .sub{color:var(--mute);margin-bottom:34px}
.glist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g{background:var(--raised);border-radius:18px;padding:24px 22px;border:1px solid var(--rule)}
.g svg{width:40px;height:40px;margin-bottom:12px}
.g h3{font:700 19px var(--serif);margin-bottom:6px}
.g p{font-size:15px;color:var(--mute)}
@media(max-width:760px){.glist{grid-template-columns:1fr}}

/* works */
.works{padding-bottom:40px}
.room{min-height:92svh;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;padding:clamp(40px,8vh,90px) 0}
.room:nth-child(even){grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.room:nth-child(even) .art{order:2}
.art{position:relative;isolation:isolate}
.art .glow{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(46px) saturate(1.5);opacity:.55;z-index:-1;border-radius:30px;animation:breathe 7s ease-in-out infinite;transform:scale(calc(1 + var(--lv,0)*.06))}
@keyframes breathe{50%{opacity:.8}}
.art button{all:unset;cursor:zoom-in;display:block;border-radius:4px;overflow:hidden;box-shadow:0 22px 50px rgba(35,38,42,.18);background:#fff}
.art img{width:100%;height:auto;max-height:82svh;object-fit:contain;transition:filter 1.2s}
.room.locked .art img{filter:blur(26px) saturate(1.2)}
.room.locked .art button{cursor:default}
.lock{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#fff;font:700 clamp(20px,3vw,28px)/1.4 var(--serif);text-shadow:0 2px 14px rgba(0,0,0,.4)}
.room.locked .lock{display:grid}
.cap .no{font:700 15px var(--sans);color:var(--mute);letter-spacing:.1em}
.cap h3{font:700 clamp(30px,4vw,46px)/1.2 var(--serif);margin:6px 0 2px}
.cap .t2{font:500 18px var(--sans);color:var(--mute);margin-bottom:18px}
.cap p{font-size:17px;max-width:28em}
.cap .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.act{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--raised);border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer}
.act.lit{border-color:var(--gold);background:#fff6df}
.act svg{width:18px;height:18px}
.room.locked .cap p,.room.locked .cap .acts{opacity:.35}
@media(max-width:820px){.room,.room:nth-child(even){grid-template-columns:1fr;min-height:auto}.room:nth-child(even) .art{order:0}}

/* wall */
.wall{padding:clamp(70px,10vw,130px) 0;text-align:center}
.wall .sub{color:var(--mute);margin-bottom:30px}
.names{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;max-width:820px;margin:0 auto 34px}
.names span{font:500 15px var(--sans);padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--rule);box-shadow:0 0 14px rgba(242,179,61,.25)}
.names .empty{background:none;border:0;box-shadow:none;color:var(--mute)}

footer{padding:56px 0 90px;border-top:1px solid var(--rule);text-align:center;color:var(--mute);font-size:14px}
footer svg{width:36px;height:36px;margin:0 auto 10px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(35,38,42,.5);padding:18px}
.modal.on{display:grid}
.sheet{background:var(--raised);border-radius:22px;max-width:440px;width:100%;padding:30px 26px 26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.25);max-height:92svh;overflow:auto}
.sheet h3{font:700 24px/1.35 var(--serif);margin-bottom:8px}
.sheet p{color:var(--mute);font-size:15px;margin-bottom:18px}
.sheet label{display:block;font-size:14px;margin:12px 0 6px}
.sheet input{width:100%;font:16px var(--sans);padding:13px 14px;border-radius:12px;border:1px solid var(--rule);background:#fff}
.sheet .cta{width:100%;justify-content:center;margin-top:20px}
.sheet .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:26px;cursor:pointer;width:40px;height:40px}
.sheet .note{font-size:12px;color:var(--mute);margin-top:12px;margin-bottom:0}
.err{color:var(--sun);font-size:14px;min-height:20px;margin-top:8px}
.dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.dl a{display:block;border-radius:8px;overflow:hidden;border:1px solid var(--rule)}
.dl a img{aspect-ratio:9/19.5;object-fit:cover;width:100%}
.dl a.secret{grid-column:span 4}
.dl a.secret img{aspect-ratio:auto;max-height:160px;object-fit:cover}
.lb{position:fixed;inset:0;z-index:45;background:rgba(20,21,23,.95);display:none;place-items:center;cursor:zoom-out;padding:14px}
.lb.on{display:grid}
.lb img{max-width:96vw;max-height:94svh;object-fit:contain}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);z-index:60;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.snd{position:fixed;right:clamp(12px,3vw,26px);bottom:clamp(12px,3vw,26px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:999px;border:1px solid var(--rule);background:rgba(246,246,243,.9);backdrop-filter:blur(10px);font:500 14px var(--sans);cursor:pointer}
.snd .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.snd .bars i{width:3px;height:4px;border-radius:2px;background:var(--leaf)}
.snd.on .bars i{animation:eq 1s ease-in-out infinite}
.snd.on .bars i:nth-child(2){animation-delay:-.3s;background:var(--water)}.snd.on .bars i:nth-child(3){animation-delay:-.6s;background:var(--sun)}
@keyframes eq{50%{height:14px}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity 1.1s ease,transform 1.1s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

<script>/* ---------- 光紋、風、點擊漣漪 ---------- */
const FX=(()=>{
  const cv=document.getElementById('fx'),cx=cv.getContext('2d');
  let W,H,dpr,t=0,energy=0,hue=0;
  const motes=[],rings=[],sparks=[],leaves=[];
  const PAL=['#3CC266','#5BB3F0','#F26B4E','#F5C451','#A6EE8C'];
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  for(let i=0;i<46;i++)motes.push({x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*2.2,c:PAL[i%5],p:Math.random()*6.3});
  function wind(x,y){return Math.sin(y*.004+t*.25)*.6+Math.cos(x*.003-t*.18)*.4}
  function leaf(x,y,big){leaves.push({x,y,vx:.6+Math.random(),vy:.3+Math.random()*.5,a:Math.random()*6,va:(Math.random()-.5)*.05,s:big?14:9+Math.random()*5,c:Math.random()<.7?'#3CC266':'#F5C451',life:1})}
  function ring(x,y,c){rings.push({x,y,r:4,a:.55,c:c||'#5BB3F0'})}
  function burst(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.3,v=.6+Math.random()*2.2;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.4,a:1,c:c||PAL[i%5]})}}
  function ribbon(i){
    const base=H*(.22+i*.28),amp=26+energy*60,col=['rgba(60,194,102,','rgba(91,179,240,','rgba(242,107,78,'][i];
    cx.beginPath();
    for(let x=-20;x<=W+20;x+=16){const y=base+Math.sin(x*.0042+t*(.22+i*.07)+i*2)*amp+Math.sin(x*.011-t*.4)*amp*.25;x<0?cx.moveTo(x,y):cx.lineTo(x,y)}
    cx.strokeStyle=col+(.07+energy*.12)+')';cx.lineWidth=18+energy*20;cx.lineCap='round';cx.stroke();
    cx.strokeStyle=col+(.16+energy*.2)+')';cx.lineWidth=1.2;cx.stroke();
  }
  function frame(){
    t+=1/60;const lv=window.Nature?Nature.level():0;energy+=(lv-energy)*.08;
    cx.clearRect(0,0,W,H);
    cx.globalCompositeOperation='multiply';for(let i=0;i<3;i++)ribbon(i);cx.globalCompositeOperation='source-over';
    for(const m of motes){const w=wind(m.x,m.y);m.x+=.25+w*.5+energy*1.2;m.y+=Math.sin(t*.6+m.p)*.25+w*.15;if(m.x>W+10)m.x=-10;if(m.y<-10)m.y=H+10;if(m.y>H+10)m.y=-10;
      cx.globalAlpha=.25+.3*Math.sin(t*1.3+m.p)**2+energy*.4;cx.fillStyle=m.c;cx.beginPath();cx.arc(m.x,m.y,m.r*(1+energy),0,6.3);cx.fill()}
    cx.globalAlpha=1;
    for(let i=rings.length;i--;){const r=rings[i];r.r+=1.6+energy*2;r.a*=.965;cx.strokeStyle=r.c;cx.globalAlpha=r.a;cx.lineWidth=1.4;cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.3);cx.stroke();cx.globalAlpha=r.a*.5;cx.beginPath();cx.arc(r.x,r.y,r.r*.62,0,6.3);cx.stroke();if(r.a<.02)rings.splice(i,1)}
    for(let i=sparks.length;i--;){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.015;s.vx*=.985;s.a*=.97;cx.globalAlpha=s.a;cx.fillStyle=s.c;cx.beginPath();cx.arc(s.x,s.y,1.8,0,6.3);cx.fill();if(s.a<.03)sparks.splice(i,1)}
    for(let i=leaves.length;i--;){const l=leaves[i];const w=wind(l.x,l.y);l.x+=l.vx+w*.8;l.y+=l.vy+Math.sin(t+l.a)*.4;l.a+=l.va+w*.01;if(l.x>W+30||l.y>H+30)l.life-=.05;
      cx.save();cx.translate(l.x,l.y);cx.rotate(l.a);cx.globalAlpha=Math.min(.85,l.life);cx.fillStyle=l.c;cx.beginPath();cx.moveTo(-l.s,0);cx.quadraticCurveTo(0,-l.s*.55,l.s,0);cx.quadraticCurveTo(0,l.s*.55,-l.s,0);cx.fill();cx.strokeStyle='rgba(255,255,255,.6)';cx.lineWidth=.8;cx.beginPath();cx.moveTo(-l.s*.8,0);cx.lineTo(l.s*.8,0);cx.stroke();cx.restore();if(l.life<=0)leaves.splice(i,1)}
    cx.globalAlpha=1;
    if(Math.random()<.0025&&leaves.length<3)leaf(-20,Math.random()*H*.7);
    if(!document.hidden)requestAnimationFrame(frame);
  }
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestAnimationFrame(frame)})}
  return{ring,burst,leaf,W:()=>W,H:()=>H};
})();

/* ---------- 大自然的聲音（全部即時生成） ---------- */
const Nature=(()=>{
  let ac,master,an,rev,buf,on=false,timers=[];
  const data=new Uint8Array(256);
  function noise(sec,brown){const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}return b}
  function loop(b){const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.start();return s}
  function init(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=0;an=ac.createAnalyser();an.fftSize=512;
    master.connect(comp);comp.connect(an);an.connect(ac.destination);
    rev=ac.createConvolver();const ir=ac.createBuffer(2,ac.sampleRate*3.2,ac.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.6)}rev.buffer=ir;
    const rg=ac.createGain();rg.gain.value=.55;rev.connect(rg);rg.connect(master);
    // 風
    const wn=loop(noise(4)),bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=.7;bp.frequency.value=500;
    const wg=ac.createGain();wg.gain.value=.035;wn.connect(bp);bp.connect(wg);wg.connect(master);
    const l1=ac.createOscillator(),l1g=ac.createGain();l1.frequency.value=.07;l1g.gain.value=260;l1.connect(l1g);l1g.connect(bp.frequency);l1.start();
    const l2=ac.createOscillator(),l2g=ac.createGain();l2.frequency.value=.05;l2g.gain.value=.022;l2.connect(l2g);l2g.connect(wg.gain);l2.start();
    // 溪水
    const st=loop(noise(5,true)),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=180;
    const sg=ac.createGain();sg.gain.value=.05;st.connect(lp);lp.connect(hp);hp.connect(sg);sg.connect(master);
    // 和聲墊
    const chords=[[146.83,220,369.99],[123.47,246.94,293.66],[98,196,293.66,493.88],[110,220,329.63,554.37]];
    const padF=ac.createBiquadFilter();padF.type='lowpass';padF.frequency.value=900;const padG=ac.createGain();padG.gain.value=.05;padF.connect(padG);padG.connect(master);padG.connect(rev);
    let ci=0;function chord(){const now=ac.currentTime;chords[ci++%4].forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=k?'sine':'triangle';o.frequency.value=f;o.detune.value=(Math.random()-.5)*8;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.26,now+3);g.gain.setValueAtTime(.26,now+7);g.gain.linearRampToValueAtTime(0,now+11);o.connect(g);g.connect(padF);o.start(now);o.stop(now+11.2)});}
    chord();timers.push(setInterval(()=>on&&chord(),8000));
    // 鳥鳴
    function bird(){if(!on)return;const now=ac.currentTime,n=3+Math.floor(Math.random()*4),base=2300+Math.random()*1300,pan=ac.createStereoPanner();pan.pan.value=Math.random()*1.6-.8;pan.connect(master);pan.connect(rev);
      for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain(),t0=now+i*(.11+Math.random()*.06);o.frequency.setValueAtTime(base,t0);o.frequency.exponentialRampToValueAtTime(base*1.45,t0+.05);o.frequency.exponentialRampToValueAtTime(base*.9,t0+.09);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.05,t0+.012);g.gain.exponentialRampToValueAtTime(.0005,t0+.1);o.connect(g);g.connect(pan);o.start(t0);o.stop(t0+.12)}
      FX.burst(FX.W()*(.15+Math.random()*.7),FX.H()*(.1+Math.random()*.25),10,'#F5C451');
      timers.push(setTimeout(bird,6000+Math.random()*9000));}
    timers.push(setTimeout(bird,3500));
    // 水滴
    function drop(){if(!on)return;const now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),f=900+Math.random()*900;o.frequency.setValueAtTime(f*1.8,now);o.frequency.exponentialRampToValueAtTime(f,now+.08);g.gain.setValueAtTime(.06,now);g.gain.exponentialRampToValueAtTime(.0005,now+.25);o.connect(g);g.connect(rev);g.connect(master);o.start(now);o.stop(now+.3);
      FX.ring(FX.W()*Math.random(),FX.H()*(.4+Math.random()*.5),'#5BB3F0');
      timers.push(setTimeout(drop,2500+Math.random()*5000));}
    timers.push(setTimeout(drop,2000));
  }
  const PENTA=[587.33,659.25,739.99,880,987.77,1174.66,1318.51];
  function chime(xr){if(!on)return;const now=ac.currentTime,f=PENTA[Math.min(6,Math.floor(xr*7))];
    [[1,'sine',.09],[2.76,'sine',.025],[1,'triangle',.03]].forEach(([m,ty,v])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f*m;g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0004,now+2.8);o.connect(g);g.connect(master);g.connect(rev);o.start(now);o.stop(now+3)})}
  function toggle(){
    if(!ac)init();on=!on;if(ac.state==='suspended')ac.resume();
    const now=ac.currentTime;master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);master.gain.linearRampToValueAtTime(on?.9:0,now+1.5);
    if(on){timers.push(setTimeout(()=>{},0));}
    return on;
  }
  function level(){if(!ac||!on)return 0;an.getByteTimeDomainData(data);let s=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;s+=v*v}return Math.min(1,Math.sqrt(s/data.length)*6)}
  return{toggle,chime,level,isOn:()=>on};
})();

/* ---------- 互動：輕觸 ---------- */
const sndBtn=document.getElementById('snd'),sndT=document.getElementById('sndt');
sndBtn.addEventListener('click',e=>{e.stopPropagation();const on=Nature.toggle();sndBtn.classList.toggle('on',on);sndBtn.setAttribute('aria-pressed',on);sndT.textContent=on?'自然聲 開':'開啟自然聲';});
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('.snd'))return;

  FX.ring(e.clientX,e.clientY,c);FX.burst(e.clientX,e.clientY,8);
  if(Math.random()<.35)FX.leaf(e.clientX,e.clientY,true);
  Nature.chime(e.clientX/innerWidth);
});

  $('lead').textContent=L().lead();$('joinTop').textContent=L().join();$('joinWall').textContent=L().join();
  $('gTitle').textContent=L().gT();$('gSub').textContent=L().gS;
  if(isOpen())$('peek').textContent=L().peekOpen;
  $('sndt').textContent=Nature.isOn()?L().sndOn:L().sndOff;
  renderRooms();renderCounts();tick();
}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';store.set('lang',lang);applyLang()};

/* countdown */
function tick(){
  const c=$('count');const left=OPEN-Date.now();
  if(left<=0){c.innerHTML=`<div><b style="font-size:clamp(24px,4vw,34px)">${L().opened}</b></div>`;return}
  const d=Math.floor(left/864e5),h=Math.floor(left/36e5)%24,m=Math.floor(left/6e4)%60,s=Math.floor(left/1e3)%60;
  c.innerHTML=[[d,L().d],[h,L().h],[m,L().m],[s,L().s]].map(([v,u])=>`<div><b>${String(v).padStart(2,'0')}</b><span>${u}</span></div>`).join('');
}
setInterval(()=>{const was=tick.open;tick.open=isOpen();if(was===false&&tick.open)applyLang();else tick()},1000);tick.open=isOpen();

/* data */
let counts={signups:0,visits:0,names:[]};
async function sb(path,body){const r=await fetch(SB+'/rest/v1/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body||{})});return r}
async function loadCounts(){try{const r=await sb('rpc/show13_counts');if(r.ok){counts=await r.json();renderCounts()}}catch(e){}}
function renderCounts(){
  $('proof').textContent=L().proof(counts.signups,counts.visits);
  $('wallSub').textContent=L().wallSub(counts.signups);
  const names=[...new Set([...(store.get('myname','')?[store.get('myname','')]:[]),...(counts.names||[])])];
  $('names').innerHTML=names.length?names.map(n=>`<span>${n.replace(/[<>&"]/g,'')}</span>`).join(''):`<span class="empty">${L().empty}</span>`;
}
if(!sessionStorage.getItem('ae13v')){try{sessionStorage.setItem('ae13v',1)}catch(e){}sb('show13_visits',{}).catch(()=>{})}
loadCounts();

/* join */
function openJoin(secret){
  $('m').classList.add('on');
  if(joined){showGifts();return}
  $('formView').hidden=false;$('giftView').hidden=true;
  $('mT').textContent=L().mT();$('mP').textContent=L().mP;$('nmL').textContent=L().nmL;$('go').textContent=L().go;$('note').textContent=L().note;$('err').textContent='';
  setTimeout(()=>$('em').focus(),50);
}
function showGifts(){
  $('formView').hidden=true;$('giftView').hidden=false;$('gvT').textContent=L().gvT;$('gvP').textContent=L().gvP;
  let h='';for(let i=1;i<=13;i++){const f=`wp/wp${String(i).padStart(2,'0')}.jpg`;h+=`<a href="${f}" download="AE-13th-Light-${i}.jpg" target="_blank"><img src="${f}" loading="lazy" alt="${L().wp} ${i}"></a>`}
  if(lit.size===13)h+=`<a class="secret" href="wp/wp-all.jpg" download="AE-13th-Light-all.jpg" target="_blank"><img src="wp/wp-all.jpg" alt="${L().secret}"></a><p style="grid-column:span 4;font-size:13px;margin:0">${L().secret}</p>`;
  $('dl').innerHTML=h;
}
$('joinTop').onclick=()=>openJoin();$('joinWall').onclick=()=>openJoin();
$('mx').onclick=()=>$('m').classList.remove('on');
$('m').onclick=e=>{if(e.target===$('m'))$('m').classList.remove('on')};
$('f').onsubmit=async e=>{
  e.preventDefault();const em=$('em').value.trim(),nm=$('nm').value.trim().slice(0,20);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$('err').textContent=L().bad;return}
  $('go').disabled=true;
  try{const r=await sb('show13_signups',{email:em,name:nm||null,lang,early:!isOpen()});
    if(!r.ok&&r.status!==409)throw 0;
    joined=true;store.set('joined',true);if(nm)store.set('myname',nm);
    const b=$('go').getBoundingClientRect();FX.burst(b.left+b.width/2,b.top,30);
    showGifts();loadCounts();applyLangButtons();
  }catch(x){$('err').textContent=L().fail}
  $('go').disabled=false;
};
function applyLangButtons(){$('joinTop').textContent=L().join();$('joinWall').textContent=L().join();renderCounts()}
$('lb').onclick=()=>$('lb').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape'){$('lb').classList.remove('on');$('m').classList.remove('on')}});

/* reveal */
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el))}

/* music level -> glow */
(function lv(){document.documentElement.style.setProperty('--lv',Nature.level().toFixed(3));requestAnimationFrame(lv)})();
</script>

<script>applyLang();renderLights();
const _snd=document.getElementById('snd');_snd.addEventListener('click',()=>setTimeout(()=>{document.getElementById('sndt').textContent=Nature.isOn()?L().sndOn:L().sndOff},0));
</script>
</body>
</html>
