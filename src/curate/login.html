<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/curate/curate.css?v=1"><script src="/curate/curate.js?v=1"></script><title>策展人登入｜AE 線上展覽</title></head><body class="cu">
<header class="cu-top"><a href="/" aria-label="AE 首頁"><img src="/assets/ae-three-rings-transparent.webp" alt="AE Universe Creation"></a><nav><a href="/ex">線上展覽</a><a href="/curate/apply">申請帳號</a></nav></header>
<main class="cu-main">
<p class="cu-kicker">AE CURATOR</p>
<h1 id="h">策展人登入</h1>
<form class="cu-card" id="lf" novalidate>
<label for="u">帳號名稱 <small>不用加 @，例如 aeuniversecreation22</small></label><input type="text" id="u" autocapitalize="none" autocomplete="username" spellcheck="false" required>
<label for="p">密碼</label><input type="password" id="p" autocomplete="current-password" required>
<div class="cu-row"><button class="cu-btn" type="submit">登入</button><a href="/curate/apply" class="cu-note">還沒有帳號？申請試用</a></div>
<p class="cu-msg" id="m" role="status"></p>
</form>
<form class="cu-card" id="cf" hidden novalidate>
<h2>先換一組自己的密碼</h2>
<p class="cu-lead">你正在使用臨時密碼。為了安全，請設定一組只有你知道的新密碼（至少 10 個字元）。</p>
<label for="c0">目前的臨時密碼</label><input type="password" id="c0" autocomplete="current-password" required>
<label for="c1">新密碼</label><input type="password" id="c1" autocomplete="new-password" minlength="10" required>
<label for="c2">再輸入一次新密碼</label><input type="password" id="c2" autocomplete="new-password" minlength="10" required>
<div class="cu-row"><button class="cu-btn" type="submit">更新密碼並進入策展室</button></div>
<p class="cu-msg" id="m2" role="status"></p>
</form>
</main>
<script>
const lf=CU.$('#lf'),cf=CU.$('#cf');
const toChange=()=>{lf.hidden=true;cf.hidden=false;CU.$('#h').textContent='歡迎你 ✦'};
(async()=>{const s=await CU.api('status');if(s.me){s.me.must_change?toChange():location.replace('/curate')}else if(s.sessionReady===false)CU.msg(CU.$('#m'),'登入功能尚未設定完成，請稍後再來。')})();
lf.addEventListener('submit',async e=>{e.preventDefault();const b=lf.querySelector('button');b.disabled=true;
 const r=await CU.api('login',{username:CU.$('#u').value.trim().replace(/^@+/,'').trim(),password:CU.$('#p').value});b.disabled=false;
 if(!r.ok)return CU.msg(CU.$('#m'),r.error||'登入失敗');CU.$('#c0').value=CU.$('#p').value;CU.$('#p').value='';r.me.must_change?toChange():location.replace('/curate')});
cf.addEventListener('submit',async e=>{e.preventDefault();const m=CU.$('#m2');
 if(CU.$('#c1').value!==CU.$('#c2').value)return CU.msg(m,'兩次輸入的新密碼不一樣');
 const b=cf.querySelector('button');b.disabled=true;const r=await CU.api('change-password',{current:CU.$('#c0').value,next:CU.$('#c1').value});b.disabled=false;
 if(!r.ok)return CU.msg(m,r.error||'更新失敗');cf.querySelectorAll('input').forEach(i=>i.value='');location.replace('/curate')});
</script></body></html>
