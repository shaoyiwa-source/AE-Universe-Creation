<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AE · ECPay Stage Checkout</title>
<style>body{margin:0;background:#0b0b0b;color:#f4efe7;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(760px,92vw);margin:50px auto}.eyebrow{letter-spacing:.18em;font-size:11px}.card{border:1px solid #49433b;padding:24px;margin:18px 0}label{display:block;margin:14px 0 6px}select,input,button{font:inherit}select,input{width:100%;padding:12px;background:#151515;color:#fff;border:1px solid #555;box-sizing:border-box}button{padding:12px 18px;margin-top:16px;border:1px solid #eee;background:#eee;color:#111;cursor:pointer}button[disabled]{opacity:.45}.note{color:#aaa;line-height:1.6}.status{white-space:pre-wrap;background:#151515;padding:12px;min-height:48px}#ECPayPayment{margin-top:20px}</style></head><body><main class="wrap"><p class="eyebrow">AE UNIVERSE CREATION · NON-PRODUCTION</p><h1>Eternal Sun · ECPay Stage</h1><p class="note">測試環境，只驗證付款流程。所有 SKU 的正式下載交付目前維持 fail-closed。</p><section class="card"><label for="sku">Edition</label><select id="sku"><option>ES-ORIGINAL</option><option>ES-GALLERY</option><option>ES-PHONE</option><option>ES-SQUARE</option></select><label for="email">Test email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button id="prepare">Prepare Stage checkout</button><div id="ECPayPayment"></div><button id="pay" disabled>Pay in ECPay Stage</button></section><pre id="status" class="status">Ready.</pre></main>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script><script src="https://ecpg-stage.ecpay.com.tw/Scripts/sdk-1.0.0.js?t=20210121100116"></script><script>
let orderToken=null; const status=document.getElementById('status'), pay=document.getElementById('pay');
function msg(x){status.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
ECPay.initialize(ECPay.ServerType.Stage, 1, function(err){if(err) msg('SDK init: '+err)});
document.getElementById('prepare').onclick=async()=>{try{pay.disabled=true;msg('Preparing…');const r=await fetch('/api/checkout/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sku:document.getElementById('sku').value,email:document.getElementById('email').value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'token failed');orderToken=j.order_token;ECPay.createPayment(j.token,ECPay.Language.zhTW,function(err){if(err)msg('createPayment UI: '+err)},'V2');pay.disabled=false;msg({order:j.order,fulfillment:j.fulfillment_reason});}catch(e){msg(e.message)}};
pay.onclick=()=>{pay.disabled=true;ECPay.getPayToken(async function(info,err){try{if(err)throw new Error(err);const r=await fetch('/api/payment/ecpay-v2/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pay_token:info.PayToken,order_token:orderToken})});const j=await r.json();if(!r.ok)throw new Error(j.error||'payment create failed');msg(j);if(j.three_d_url) location.href=j.three_d_url;else if(j.union_pay_url) location.href=j.union_pay_url;}catch(e){msg(e.message);pay.disabled=false}})};
</script></body></html>
