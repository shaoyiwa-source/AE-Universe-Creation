<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AE · ECPay Stage Checkout</title>
<style>body{margin:0;background:#0b0b0b;color:#f4efe7;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(760px,92vw);margin:50px auto}.eyebrow{letter-spacing:.18em;font-size:11px}.card{border:1px solid #49433b;padding:24px;margin:18px 0}label{display:block;margin:14px 0 6px}select,input,button{font:inherit}select,input{width:100%;padding:12px;background:#151515;color:#fff;border:1px solid #555;box-sizing:border-box}button{padding:12px 18px;margin-top:16px;border:1px solid #eee;background:#eee;color:#111;cursor:pointer}button[disabled]{opacity:.45}.note{color:#aaa;line-height:1.6}.status{white-space:pre-wrap;background:#151515;padding:12px;min-height:48px}#ECPayPayment{margin-top:20px}</style></head><body><main class="wrap"><p class="eyebrow">AE UNIVERSE CREATION · NON-PRODUCTION</p><h1>Eternal Sun · ECPay Stage</h1><p class="note">測試環境：驗證付款、伺服器付款確認與私有交付。正式 Production 尚未啟用。</p><section class="card"><label for="sku">Edition</label><select id="sku"><option>ES-ORIGINAL</option><option>ES-GALLERY</option><option>ES-PHONE</option><option>ES-SQUARE</option></select><label for="email">Test email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button id="prepare">Prepare Stage checkout</button><div id="ECPayPayment"></div><button id="pay" disabled>Pay in ECPay Stage</button><button id="verify">Verify payment status</button><button id="download" disabled>Get private download</button></section><pre id="status" class="status">Ready.</pre></main>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script><script src="https://ecpg-stage.ecpay.com.tw/Scripts/sdk-1.0.0.js?t=20210121100116"></script><script>
let orderToken=sessionStorage.getItem('ae_stage_order_token')||null;
const status=document.getElementById('status'), pay=document.getElementById('pay'), verify=document.getElementById('verify'), download=document.getElementById('download');
function msg(x){status.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
async function postJson(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(_){j={error:'NON_JSON_RESPONSE'}}if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.payload=j;throw e}return j}
ECPay.initialize(ECPay.ServerType.Stage, 1, function(err){if(err) msg('SDK init: '+err)});
document.getElementById('prepare').onclick=async()=>{try{pay.disabled=true;download.disabled=true;msg('Preparing…');const j=await postJson('/api/checkout/create',{sku:document.getElementById('sku').value,email:document.getElementById('email').value});orderToken=j.order_token;sessionStorage.setItem('ae_stage_order_token',orderToken);ECPay.createPayment(j.token,ECPay.Language.zhTW,function(err){if(err)msg('createPayment UI: '+err)},'V2');pay.disabled=false;msg({order:j.order,asset_manifest_id:j.asset_manifest_id,fulfillment:j.fulfillment_reason});}catch(e){msg(e.payload||e.message)}};
pay.onclick=()=>{pay.disabled=true;ECPay.getPayToken(async function(info,err){try{if(err)throw new Error(err);const j=await postJson('/api/payment/ecpay-v2/create',{pay_token:info.PayToken,order_token:orderToken});msg(j);if(j.three_d_url) location.href=j.three_d_url;else if(j.union_pay_url) location.href=j.union_pay_url;else pay.disabled=false}catch(e){msg(e.payload||e.message);pay.disabled=false}})};
verify.onclick=async()=>{try{if(!orderToken)throw new Error('Prepare checkout first.');const j=await postJson('/api/order/status',{order_token:orderToken});download.disabled=!j.paid_verified;msg(j)}catch(e){download.disabled=true;msg(e.payload||e.message)}};
download.onclick=async()=>{try{if(!orderToken)throw new Error('Missing order token.');const j=await postJson('/api/order/download-token',{order_token:orderToken});msg(j);if(j.download_url) location.href=j.download_url}catch(e){msg(e.payload||e.message)}};
if(orderToken) msg('Existing Stage order token restored. Verify payment status when ready.');
</script></body></html>
