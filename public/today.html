<script>
const lines = [
  {word:"靠近", line:"先停一下，讓光進來。"},
  {word:"一小步", line:"夢不用一次走完。"},
  {word:"留白", line:"空著的地方，才容得下新的。"},
  {word:"光", line:"陰暗角落也有光。"},
  {word:"手", line:"由心而生，由手而行。"},
  {word:"聽", line:"先聽，再回答。"},
  {word:"種", line:"種下的，會自己長。"},
  {word:"回望", line:"回頭，是為了再走。"},
  {word:"縫", line:"裂開的地方，可以縫。"},
  {word:"燃", line:"小火也能照亮。"},
  {word:"渡", line:"過河的人，也是橋。"},
  {word:"再", line:"下一次，還在等你。"}
];
const see = document.getElementById('see');
const got = document.getElementById('got');
const wordEl = document.getElementById('word');
const lineEl = document.getElementById('line');
const key = 'ae_today_draw_v1';

function show(item){
  wordEl.textContent = item.word;
  lineEl.textContent = item.line;
  see.style.display = 'none';
  got.style.display = 'block';
}

function draw(){
  if (sessionStorage.getItem(key) && !location.search.includes('again=1')){
    try { show(JSON.parse(sessionStorage.getItem(key))); return; } catch(e){}
  }
  const item = lines[Math.floor(Math.random()*lines.length)];
  sessionStorage.setItem(key, JSON.stringify(item));
  show(item);
}

document.getElementById('drawBtn').addEventListener('click', draw);
if (location.search.includes('again=1')) sessionStorage.removeItem(key);
</script>
