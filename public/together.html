<style>
:root{--paper:#f3efe6;--ink:#1a1612;--night:#090909;--warm:#f6f1e8;--muted:#8d867c;--line:rgba(255,255,255,.16);--gold:#e7bd67;--rose:#e7b0c8}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--warm);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit}
button,a{font:inherit}
.wrap{width:min(720px,92vw);margin:0 auto;padding:18px 0 36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.brand{font-family:Georgia,serif;letter-spacing:.04em;text-decoration:none;font-size:15px}
.lang{background:none;border:0;color:inherit;min-height:44px;cursor:pointer}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(32px,8vw,52px);line-height:1.05;letter-spacing:.06em;margin:.1em 0 .2em}
.how{margin:0 0 8px;line-height:1.45;color:#ddd4c8;font-size:16px}
.code{margin:0;color:var(--muted);letter-spacing:.14em;font-size:12px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,calc((100dvh - 330px) * 9 / 16));margin:12px auto;padding:6px;border:1px solid var(--line);border-radius:22px}
.cell{position:relative;aspect-ratio:9/16;padding:0;border:0;border-radius:13px;overflow:hidden;background:#141210;cursor:pointer;perspective:800px;box-shadow:inset 0 0 0 1px rgba(255,248,235,.28)}
.cell img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1) saturate(1.05);transition:filter .35s ease}
.cell.is-born img{filter:brightness(1.4) saturate(1.35) contrast(1.05)}
.cell::after{content:"";position:absolute;left:calc(50% - .5px);top:8%;bottom:8%;width:1px;background:rgba(255,250,240,.22);z-index:3;pointer-events:none}
.cell.opening{overflow:visible;z-index:5}
.cell.opening::after{opacity:0}
.cell.opening img{filter:brightness(1.65) saturate(1.2)}
.door{position:absolute;inset:0;z-index:8;pointer-events:none;transform-style:preserve-3d}
.leaf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;backface-visibility:hidden}
.leaf.left{clip-path:inset(0 50% 0 0);transform-origin:left center;animation:swing-l .92s ease forwards}
.leaf.right{clip-path:inset(0 0 0 50%);transform-origin:right center;animation:swing-r .92s ease forwards}
.beam{position:absolute;left:34%;width:32%;height:78%;bottom:16%;border-radius:999px;background:linear-gradient(to top,rgba(255,228,170,0),rgba(255,252,245,.98) 40%,rgba(255,255,255,0));filter:blur(.3px);z-index:9;animation:beam-out .92s ease forwards}
@keyframes swing-l{0%{transform:translateX(0) rotateY(0)}32%{transform:translateX(-22%) rotateY(-70deg)}58%{transform:translateX(-22%) rotateY(-70deg)}100%{transform:translateX(0) rotateY(0)}}
@keyframes swing-r{0%{transform:translateX(0) rotateY(0)}32%{transform:translateX(22%) rotateY(70deg)}58%{transform:translateX(22%) rotateY(70deg)}100%{transform:translateX(0) rotateY(0)}}
@keyframes beam-out{0%{opacity:0;transform:translateY(24%) scale(.65)}28%{opacity:1;transform:translateY(-8%) scale(1)}100%{opacity:0;transform:translateY(-175%) scale(1.2)}}
.cell:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  .leaf,.beam{animation:none}
}
.born{position:absolute;left:50%;top:42%;width:42%;aspect-ratio:1/2;transform:translate(-50%,-50%);pointer-events:none;z-index:4;background:none;border-radius:0;box-shadow:none}
.born svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 8px rgba(90,255,210,.75))}
.mark{position:absolute;z-index:2;width:26%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);color:#1a140f;font:400 clamp(13px,3.6vw,20px)/1 Georgia,serif;box-shadow:0 0 0 2px rgba(255,255,255,.8);pointer-events:none}
.mark.you{background:radial-gradient(circle at 35% 25%,#fff7d8,var(--gold) 62%,#b8893e)}
.mark.them{background:radial-gradient(circle at 35% 25%,#e7f2ff,#5b8def 62%,#2c4e98)}
.below{display:grid;gap:8px;margin-top:8px}
.presence,.count{margin:0;min-height:1.3em}
.share,.make{min-height:48px;border-radius:999px;border:1px solid var(--warm);background:var(--warm);color:#16130f;cursor:pointer}
.make[hidden]{display:none}
.ask,.figures,.dollar{margin-top:18px}
.ask[hidden],.figures[hidden],.dollar[hidden]{display:none}
.ask h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(28px,7vw,40px);margin:0 0 12px}
.q{display:grid;gap:6px;margin:0 0 12px}
.q > span{font-size:13px;letter-spacing:.06em;color:#c8bfb2}
.date{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:8px}
.ask input,.ask select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#141210;color:var(--warm);padding:0 12px}
.ask input:focus-visible,.ask select:focus-visible,.showfigs:focus-visible,.fig:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.showfigs{min-height:48px;border-radius:999px;border:1px solid var(--warm);background:transparent;color:var(--warm);cursor:pointer}
.pickline{margin:0 0 8px;color:#ddd4c8}
.figrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fig{padding:8px 4px 10px;border-radius:18px;border:1px solid rgba(36,28,20,.14);background:#f6f1e6;color:#241c14;cursor:pointer}
.fig:nth-child(1),.fig:nth-child(2),.fig:nth-child(3){background:#f6f1e6}
.fig svg{width:100%;height:auto;display:block}
.fig small{display:block;text-align:center;letter-spacing:.16em;font-size:11px;color:#8a7d6a}
.dollar{background:#f4efe6;color:#241c14;border-radius:22px;padding:26px 22px 16px;border:1px solid #e5dccb;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65),0 12px 32px rgba(0,0,0,.22)}
.kicker{margin:0;text-align:center;letter-spacing:.42em;font-size:10px;color:#9a8d78}
.ticket-fig{width:min(188px,54vw);margin:4px auto 0}
.ticket-fig svg{width:100%;height:auto;display:block}
.ticket-num{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(26px,6.4vw,34px);letter-spacing:.16em;text-align:center;margin:6px 0 16px;color:#1c1712}
.pass-qr{display:block;width:112px;height:112px;background:#fff;image-rendering:pixelated;margin:0 auto 14px;border-radius:4px}
.reason{margin:0 auto;max-width:16em;color:#6a5f52;font-size:13px;line-height:1.55;text-align:center}
.kofi{margin:14px 0 0;color:#a39888;font-size:11px;text-align:center}

.shop{margin:10px 0 0;color:#7f786f;font-size:11px;line-height:1.45}

.note{color:#c4554a;min-height:1.2em;font-size:13px}
@media(max-width:820px){
  .wrap{padding-top:12px}
  h1{font-size:clamp(34px,9vw,48px)}
}

<script>
const ABC = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const SYMBOLS = ['♥','∞','☾','✦','❀','☁','◌','⌁'];
const CODE_RE = /^LP-[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{8}$/;
const SIGNS = [
  ['aries', 'Aries', '牡羊'],
  ['taurus', 'Taurus', '金牛'],
  ['gemini', 'Gemini', '雙子'],
  ['cancer', 'Cancer', '巨蟹'],
  ['leo', 'Leo', '獅子'],
  ['virgo', 'Virgo', '處女'],
  ['libra', 'Libra', '天秤'],
  ['scorpio', 'Scorpio', '天蠍'],
  ['sagittarius', 'Sagittarius', '射手'],
  ['capricorn', 'Capricorn', '摩羯'],
  ['aquarius', 'Aquarius', '水瓶'],
  ['pisces', 'Pisces', '雙魚']
];
const BLOODS = ['A', 'B', 'AB', 'O'];
function hash32(text) {
  let h = 2166136261 >>> 0;
  const s = String(text);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function mix(h, i) {
  let x = (h + Math.imul(i + 1, 2654435761)) >>> 0;
  x ^= x >>> 16;
  x = Math.imul(x, 0x7feb352d) >>> 0;
  x ^= x >>> 15;
  x = Math.imul(x, 0x846ca68b) >>> 0;
  x ^= x >>> 16;
  return x >>> 0;
}
function validDate(y, m, d) {
  if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) return false;
  if (y < 1900 || m < 1 || m > 12 || d < 1) return false;
  if (d > new Date(Date.UTC(y, m, 0)).getUTCDate()) return false;
  const now = new Date();
  const today = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  return y * 10000 + m * 100 + d <= today;
}
function bornOk(born) {
  return !!(born && validDate(born.y, born.m, born.d) && SIGNS.some((sign) => sign[0] === born.sign) && BLOODS.indexOf(born.blood) >= 0);
}

function pick(len, prefix) {
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  let out = prefix;
  for (let i = 0; i < len; i++) out += ABC[bytes[i] % ABC.length];
  return out;
}
function lang() {
  return (document.documentElement.lang || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
function say(el, en, zh) {
  if (!el) return;
  el.dataset.en = en;
  el.dataset.zh = zh;
  el.textContent = lang() === 'zh' ? zh : en;
}
function handId() {
  const key = 'ae_together_hand';
  try {
    const saved = sessionStorage.getItem(key);
    if (/^h[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}$/.test(saved || '')) return saved;
    const next = pick(6, 'h');
    sessionStorage.setItem(key, next);
    return next;
  } catch (error) {
    return pick(6, 'h');
  }
}
const PASS_KEY = 'ae_together_pass';
function savedPass() {
  try {
    const data = JSON.parse(localStorage.getItem(PASS_KEY) || '');
    if (!data || !CODE_RE.test(data.code) || !Array.isArray(data.marks)) return null;
    if (!bornOk(data.born)) data.born = null;
    const pickOk = data.pick === 0 || data.pick === 1 || data.pick === 2;
    if (!data.born || !pickOk || !/^\d{10}$/.test(data.ticket || '')) {
      data.pick = null;
      data.ticket = null;
    }
    return data;
  } catch (error) {
    return null;
  }
}
function roomCode() {
  const params = new URLSearchParams(location.search);
  const given = params.get('lp') || '';
  const pass = savedPass();
  if (pass && !CODE_RE.test(given)) {
    params.set('lp', pass.code);
    history.replaceState(null, '', location.pathname + '?' + params.toString());
    return pass.code;
  }
  if (CODE_RE.test(given)) return given;
  const next = pick(8, 'LP-');
  params.set('lp', next);
  history.replaceState(null, '', location.pathname + '?' + params.toString());
  return next;
}

const code = roomCode();
const hand = handId();
const state = { marks: [], others: 0, shared: true, mine: 0 };
let files = [];
let lastDoor = null;

function shareUrl() {
  const pass = savedPass();
  return location.origin + '/together?lp=' + (pass ? pass.code : code);
}
function showCodeLine() {
  const pass = savedPass();
  document.getElementById('codeLine').textContent = pass ? ('AE · ' + pass.code) : 'AE · ……';
}
function paintSaved() {
  const pass = savedPass();
  if (!pass) return;
  state.marks = pass.marks.map((mark) => ({
    id: mark.id,
    art: mark.art,
    symbol: mark.symbol,
    yours: mark.yours !== false
  }));
}
function labelCells() {
  document.querySelectorAll('.cell').forEach((cell) => {
    const n = Number(cell.dataset.i) + 1;
    cell.setAttribute('aria-label', lang() === 'zh' ? '打開第 ' + n + ' 扇門' : 'Open door ' + n);
  });
}
function sharedArts() {
  const you = new Set(state.marks.filter((mark) => mark.yours).map((mark) => mark.art));
  const both = new Set();
  state.marks.forEach((mark) => { if (!mark.yours && you.has(mark.art)) both.add(mark.art); });
  return both;
}
function renderMarks() {
  labelCells();
  document.querySelectorAll('.mark,.born').forEach((node) => node.remove());
  document.querySelectorAll('.cell.is-born').forEach((cell) => cell.classList.remove('is-born'));
  const both = sharedArts();
  both.forEach((art) => {
    const cell = document.querySelector('.cell[data-i="' + art + '"]');
    if (!cell) return;
    cell.classList.add('is-born');
    const born = document.createElement('i');
    born.className = 'born';
    born.setAttribute('aria-hidden', 'true');
    born.innerHTML = overlapFlameSvg(hash32('overlap|' + [...both].sort((a, b) => a - b).join(',')), 1, 'cell' + art);
    cell.appendChild(born);
  });
  const placed = {};
  state.marks.forEach((mark) => {
    const cell = document.querySelector('.cell[data-i="' + mark.art + '"]');
    if (!cell) return;
    const key = mark.art + (mark.yours ? ':you' : ':them');
    const n = placed[key] || 0;
    placed[key] = n + 1;
    const el = document.createElement('i');
    el.className = 'mark ' + (mark.yours ? 'you' : 'them');
    el.textContent = mark.symbol;
    el.style.left = (mark.yours ? 22 + n * 6 : 78 - n * 6) + '%';
    el.style.top = (mark.yours ? 18 + n * 8 : 82 - n * 6) + '%';
    cell.appendChild(el);
  });
  const count = document.getElementById('countLine');
  const n = state.marks.length;
  if (both.size) say(count, 'A third color and a third shape.', '第三個顏色，和第三個形狀。');
  else say(count, 'Together, ' + n + (n === 1 ? ' light.' : ' lights.'), '一起留下了 ' + n + ' 道。');
  const presence = document.getElementById('presence');
  if (state.others > 0) say(presence, 'The other hands are here.', '另一雙手到了。');
  else say(presence, 'You can play alone.', '一個人也可以玩。');
  const board = document.getElementById('board');
  if (board) board.setAttribute('aria-label', lang() === 'zh' ? '九扇門' : 'Nine doors');
  syncStage();
}
function codeFromPlay(marks) {
  const payload = JSON.stringify(marks.filter((mark) => mark.yours).map((mark) => [mark.art, mark.symbol]));
  let h = 2166136261 >>> 0;
  const text = payload + '|' + hand;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  let x = h >>> 0;
  let out = 'LP-';
  for (let i = 0; i < 8; i++) {
    x ^= x >>> 16;
    x = Math.imul(x, 0x7feb352d) >>> 0;
    x ^= x >>> 15;
    x = Math.imul(x, 0x846ca68b) >>> 0;
    x ^= x >>> 16;
    out += ABC[(x >>> 0) % ABC.length];
    x = (x + h + Math.imul(i + 1, 2654435761)) >>> 0;
  }
  return out;
}
const FLAME_D = 'M80 16C108 48 104 86 92 112C86 132 84 156 80 176C76 156 74 132 68 112C56 86 52 48 80 16Z';
function overlapList() {
  return [...sharedArts()].sort((a, b) => a - b);
}
function flameSeed(pass) {
  const live = overlapList();
  const arts = pass && pass.ticket && Array.isArray(pass.overlap)
    ? pass.overlap
    : (live.length ? live : (pass && Array.isArray(pass.overlap) ? pass.overlap : []));
  const place = arts.length ? arts.join(',') : (pass ? pass.code : 'solo');
  const born = pass && pass.born ? [pass.born.sign, pass.born.blood, pass.born.y, pass.born.m, pass.born.d].join('|') : '';
  return hash32(place + '|' + born);
}
function overlapFlameSvg(seed, index, tag) {
  const scale = [0.84, 1, 1.14][index] || 1;
  const tongue = (0.36 + (mix(seed, index + 2) % 16) / 100).toFixed(2);
  const gid = 'fm' + tag + index;
  return '<svg viewBox="36 0 88 190" data-shape="flame" aria-hidden="true"><defs>'
    + '<linearGradient id="' + gid + 'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fffb"/><stop offset=".45" stop-color="#8dffe4"/><stop offset="1" stop-color="#14c9a4"/></linearGradient>'
    + '<linearGradient id="' + gid + 'e" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e7bd67"/><stop offset=".5" stop-color="#7dfff0"/><stop offset="1" stop-color="#5b8def"/></linearGradient>'
    + '</defs><g transform="translate(80 96) scale(' + scale + ') translate(-80 -96)">'
    + '<path data-flame="1" d="' + FLAME_D + '" fill="url(#' + gid + 'b)"/>'
    + '<path d="' + FLAME_D + '" fill="none" stroke="url(#' + gid + 'e)" stroke-width="5" stroke-linejoin="round"/>'
    + '<path d="' + FLAME_D + '" fill="#f7fffc" opacity=".9" transform="translate(80 108) scale(' + tongue + ') translate(-80 -108)"/>'
    + '</g></svg>';
}
function figureSvg(seed, index, tag) {
  const pals = [
    ['#ffe08a', '#f0a030', '#ff7a3c', '#fff3c4', '#7eb0ea', '#3dffe0'],
    ['#ffe08a', '#5b8def', '#3dffe0', '#ff8ec8', '#fff4c8', '#f0a030'],
    ['#9ec6ff', '#3d6fe0', '#1e3f88', '#e7f2ff', '#e7bd67', '#3dffe0']
  ];
  const hair = pals[index] || pals[1];
  const spiral = ['#e7bd67', '#14c9a4', '#5b8def'][index] || '#14c9a4';
  const scale = [0.92, 1, 1.06][index] || 1;
  const gid = 'mm' + tag + index;
  const jitter = (n) => (mix(seed, n) % 11) - 5;
  let fur = '';
  for (let i = 0; i < 20; i++) {
    const ang = (-168 + i * (336 / 19) + jitter(i + 4)).toFixed(1);
    const len = 18 + (mix(seed, i + 20) % 12);
    const col = hair[i % hair.length];
    fur += '<ellipse cx="70" cy="' + (58 - len) + '" rx="3.4" ry="' + len + '" fill="' + col + '" transform="rotate(' + ang + ' 70 64)"/>';
  }
  let stars = '';
  [[48, 56], [42, 64], [54, 68], [40, 52], [78, 54], [86, 62], [74, 70], [90, 50]].forEach((p, i) => {
    const dx = jitter(i + 40) * 0.15;
    stars += '<circle cx="' + (p[0] + dx).toFixed(1) + '" cy="' + p[1] + '" r="' + (i % 3 === 0 ? 1.15 : 0.7) + '" fill="#fff" opacity=".9"/>';
  });
  const spiralD = (function () {
    let d = '';
    for (let i = 0; i <= 26; i++) {
      const t = i / 26;
      const a = t * Math.PI * 5.2;
      const r = 1.2 + t * 9.2;
      const x = 70 + Math.cos(a) * r;
      const y = 112 + Math.sin(a) * r;
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    return d;
  })();
  return '<svg viewBox="8 4 124 158" data-shape="maomao" aria-hidden="true"><defs>'
    + '<radialGradient id="' + gid + '" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#6a4ea8"/><stop offset=".42" stop-color="#1a1238"/><stop offset="1" stop-color="#07060f"/></radialGradient>'
    + '</defs>'
    + '<g transform="translate(70 86) scale(' + scale + ') translate(-70 -86)">'
    + '<ellipse cx="70" cy="146" rx="24" ry="5" fill="#241c14" opacity=".12"/>'
    + fur
    + '<ellipse cx="46" cy="112" rx="8" ry="5.5" fill="#16120f" transform="rotate(-28 46 112)"/>'
    + '<ellipse cx="94" cy="112" rx="8" ry="5.5" fill="#16120f" transform="rotate(28 94 112)"/>'
    + '<ellipse cx="70" cy="114" rx="24" ry="26" fill="#16120f"/>'
    + '<ellipse cx="70" cy="104" rx="12" ry="8" fill="#2a241e" opacity=".55"/>'
    + '<ellipse cx="58" cy="140" rx="9" ry="6" fill="#16120f"/>'
    + '<ellipse cx="82" cy="140" rx="9" ry="6" fill="#16120f"/>'
    + '<path d="' + spiralD + '" fill="none" stroke="' + spiral + '" stroke-width="2.3" stroke-linecap="round"/>'
    + '<circle cx="54" cy="62" r="24" fill="url(#' + gid + ')"/>'
    + '<circle cx="86" cy="62" r="24" fill="url(#' + gid + ')"/>'
    + '<circle cx="54" cy="62" r="24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.3"/>'
    + '<circle cx="86" cy="62" r="24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.3"/>'
    + stars
    + '<path d="M44 62c0-6 6-8 10-4 4 4 4 4 0 8-4 4-10 2-10-4zm20 0c0-6 6-8 10-4 4 4 4 4 0 8-4 4-10 2-10-4z" fill="none" stroke="#f2d27a" stroke-width="1.35" stroke-linecap="round"/>'
    + '<ellipse cx="46" cy="54" rx="5" ry="3.2" fill="#fff" opacity=".88"/>'
    + '<ellipse cx="78" cy="54" rx="5" ry="3.2" fill="#fff" opacity=".88"/>'
    + '</g></svg>';
}
function figureSeed(pass) {
  const born = pass.born;
  return hash32([pass.code, born.y, born.m, born.d, born.sign, born.blood].join('|'));
}
function ticketDigits(pass, pick) {
  let h = figureSeed(pass);
  let out = '';
  for (let i = 0; i < 10; i++) {
    h = mix(h, pick * 10 + i + 3);
    out += String(h % 10);
  }
  return out;
}
let choiceLang = '';
function paintChoices() {
  const now = lang();
  const zodiac = document.getElementById('zodiac');
  const blood = document.getElementById('blood');
  if (choiceLang === now && zodiac.options.length > 1 && blood.options.length > 1) return;
  const z = zodiac.value;
  const b = blood.value;
  const zh = now === 'zh';
  zodiac.innerHTML = '<option value="">' + (zh ? '請選' : 'Choose') + '</option>' + SIGNS.map((sign) => '<option value="' + sign[0] + '">' + (zh ? sign[2] : sign[1]) + '</option>').join('');
  blood.innerHTML = '<option value="">' + (zh ? '請選' : 'Choose') + '</option>' + BLOODS.map((type) => '<option value="' + type + '">' + type + '</option>').join('');
  zodiac.value = z;
  blood.value = b;
  choiceLang = now;
}
function fillAsk(pass) {
  const ask = document.getElementById('ask');
  if (!pass || !pass.born || ask.dataset.filled === '1') return;
  document.getElementById('birthYear').value = String(pass.born.y);
  document.getElementById('birthMonth').value = String(pass.born.m);
  document.getElementById('birthDay').value = String(pass.born.d);
  document.getElementById('zodiac').value = pass.born.sign;
  document.getElementById('blood').value = pass.born.blood;
  ask.dataset.filled = '1';
}
function readInt(id) {
  const raw = document.getElementById(id).value.trim();
  if (!/^\d+$/.test(raw)) return NaN;
  return Number(raw);
}
function readBorn() {
  const born = {
    y: readInt('birthYear'),
    m: readInt('birthMonth'),
    d: readInt('birthDay'),
    sign: document.getElementById('zodiac').value,
    blood: document.getElementById('blood').value
  };
  return bornOk(born) ? born : null;
}
function paintFigures(pass) {
  const row = document.getElementById('figRow');
  const key = [pass.code, pass.born.y, pass.born.m, pass.born.d, pass.born.sign, pass.born.blood, overlapList().join(',')].join('|');
  const seed = flameSeed(pass);
  if (row.dataset.key !== key || row.childElementCount !== 3) {
    row.dataset.key = key;
    row.innerHTML = [0, 1, 2].map((i) => '<button class="fig" type="button" data-fig="' + i + '">' + figureSvg(seed, i, 'f') + '<small>' + (i + 1) + '</small></button>').join('');
  }
  row.querySelectorAll('[data-fig]').forEach((btn, i) => {
    btn.setAttribute('aria-label', lang() === 'zh' ? '身影 ' + (i + 1) : 'Figure ' + (i + 1));
  });
}
function paintTicket(pass) {
  const seed = flameSeed(pass);
  const hold = document.getElementById('ticketFig');
  const key = pass.code + '|' + pass.pick + '|' + pass.ticket + '|' + (pass.overlap || []).join(',');
  if (hold.dataset.key !== key) {
    hold.dataset.key = key;
    hold.innerHTML = figureSvg(seed, pass.pick, 't');
  }
  document.getElementById('ticketNum').textContent = pass.ticket.replace(/(\d{4})(\d{4})(\d{2})/, '$1 $2 $3');
}
function syncStage() {
  const pass = savedPass();
  const locked = !!(pass && pass.ticket);
  paintChoices();
  document.getElementById('birthYear').setAttribute('aria-label', lang() === 'zh' ? '年' : 'Year');
  document.getElementById('birthMonth').setAttribute('aria-label', lang() === 'zh' ? '月' : 'Month');
  document.getElementById('birthDay').setAttribute('aria-label', lang() === 'zh' ? '日' : 'Day');
  document.getElementById('ask').hidden = !pass || locked;
  document.getElementById('figures').hidden = !pass || !pass.born || locked;
  document.getElementById('dollar').hidden = !locked;
  document.getElementById('makeBtn').hidden = !!pass;
  if (pass && pass.born && !locked) {
    fillAsk(pass);
    paintFigures(pass);
  }
  if (locked) {
    paintTicket(pass);
    drawPass();
  }
  const qrImg = document.getElementById('passQr');
  if (qrImg) qrImg.alt = lang() === 'zh' ? '這張卡的 QR code' : 'QR code for this card';
}
function showFigures() {
  const pass = savedPass();
  const note = document.getElementById('askNote');
  if (!pass || pass.ticket) return;
  const born = readBorn();
  if (!born) {
    say(note, 'Answer the three questions.', '先回答這三題。');
    return;
  }
  note.textContent = '';
  pass.born = born;
  pass.pick = null;
  pass.ticket = null;
  const live = overlapList();
  if (live.length) pass.overlap = live;
  localStorage.setItem(PASS_KEY, JSON.stringify(pass));
  document.getElementById('ask').dataset.filled = '1';
  syncStage();
}
function chooseFigure(index) {
  const pass = savedPass();
  if (!pass || !pass.born || pass.ticket) return;
  if (index !== 0 && index !== 1 && index !== 2) return;
  pass.pick = index;
  pass.ticket = ticketDigits(pass, index);
  const live = overlapList();
  if (live.length) {
    pass.overlap = live;
    pass.marks = state.marks.map((mark) => ({
      id: mark.id,
      art: mark.art,
      symbol: mark.symbol,
      yours: !!mark.yours
    }));
  } else if (!Array.isArray(pass.overlap)) pass.overlap = [];
  localStorage.setItem(PASS_KEY, JSON.stringify(pass));
  syncStage();
  const card = document.getElementById('dollar');
  if (card && card.scrollIntoView) card.scrollIntoView({ block: 'nearest' });
}
function drawPass() {
  const pass = savedPass();
  if (!pass || !pass.ticket) return;
  const payload = location.origin + '/together?n=' + pass.ticket;
  const img = document.getElementById('passQr');
  document.getElementById('ticketNum').textContent = pass.ticket.replace(/(\d{4})(\d{4})(\d{2})/, '$1 $2 $3');
  if (img.dataset.payload === payload && img.getAttribute('src')) return;
  const qr = qrcode(0, 'M');
  qr.addData(payload);
  qr.make();
  img.src = qr.createDataURL(4, 16);
  img.dataset.payload = payload;
}
function makePass() {
  if (savedPass()) return;
  const note = document.getElementById('note');
  const yours = state.marks.filter((mark) => mark.yours);
  if (!yours.length) {
    note.dataset.hold = '1';
    say(note, 'Open a door first.', '先點一扇門。');
    setTimeout(() => { delete note.dataset.hold; }, 2500);
    return;
  }
  const id = codeFromPlay(state.marks);
  const picture = state.marks.map((mark) => ({
    id: mark.id,
    art: mark.art,
    symbol: mark.symbol,
    yours: !!mark.yours
  }));
  localStorage.setItem(PASS_KEY, JSON.stringify({ code: id, marks: picture, v: 2, born: null, pick: null, ticket: null, overlap: overlapList() }));
  try {
    const kept = JSON.parse(localStorage.getItem('ae_lightprint') || '');
    if (!kept || !CODE_RE.test(kept.code)) {
      localStorage.setItem('ae_lightprint', JSON.stringify({
        code: id,
        label: 'AE · ' + id,
        sealedAt: new Date().toISOString(),
        v: '1.2',
        source: 'together'
      }));
    }
  } catch (error) {
    try {
      localStorage.setItem('ae_lightprint', JSON.stringify({
        code: id,
        label: 'AE · ' + id,
        sealedAt: new Date().toISOString(),
        v: '1.2',
        source: 'together'
      }));
    } catch (err) { /* private mode */ }
  }
  showCodeLine();
  renderMarks();
  const ask = document.getElementById('ask');
  if (ask && !ask.hidden && ask.scrollIntoView) ask.scrollIntoView({ block: 'nearest' });
}
function openDoor(cell) {
  if (!cell) return;
  lastDoor = cell;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const img = cell.querySelector(':scope > img');
  if (!img) return;
  cell.querySelectorAll('.door').forEach((node) => node.remove());
  const door = document.createElement('span');
  door.className = 'door';
  door.setAttribute('aria-hidden', 'true');
  ['left', 'right'].forEach((side) => {
    const leaf = document.createElement('img');
    leaf.className = 'leaf ' + side;
    leaf.alt = '';
    leaf.src = img.currentSrc || img.src;
    door.appendChild(leaf);
  });
  const beam = document.createElement('i');
  beam.className = 'beam';
  door.appendChild(beam);
  cell.classList.add('opening');
  cell.appendChild(door);
  window.setTimeout(() => {
    cell.classList.remove('opening');
    door.remove();
  }, 940);
}
function roomMarks(serverMarks) {
  const incoming = Array.isArray(serverMarks) ? serverMarks : [];
  const pass = savedPass();
  if (!pass) return incoming;
  const base = pass.marks.map((mark) => ({
    id: mark.id,
    art: mark.art,
    symbol: mark.symbol,
    yours: mark.yours !== false
  }));
  if (pass.ticket) return base;
  const ids = new Set(base.map((mark) => mark.id));
  incoming.forEach((mark) => {
    if (!mark || ids.has(mark.id) || mark.yours) return;
    base.push({ id: mark.id, art: mark.art, symbol: mark.symbol, yours: false });
    ids.add(mark.id);
  });
  return base;
}
async function pull() {
  const res = await fetch('/api/together?code=' + code + '&hand=' + hand, { cache: 'no-store' });
  if (!res.ok) throw new Error('pull');
  const data = await res.json();
  state.marks = roomMarks(data.marks || []);
  state.others = data.others || 0;
  state.shared = data.shared !== false;
  renderMarks();
  const note = document.getElementById('note');
  if (!state.shared) say(note, 'This preview cannot share the table yet.', '這個預覽還不能把桌子共享出去。');
  else if (!note.dataset.hold) note.textContent = '';
}
async function tap(art) {
  openDoor(document.querySelector('.cell[data-i="' + art + '"]'));
  const symbol = SYMBOLS[state.mine % SYMBOLS.length];
  state.mine += 1;
  const id = pick(8, 'm');
  state.marks.push({ id, art, symbol, yours: true });
  renderMarks();
  const res = await fetch('/api/together', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code, hand, art, symbol, id }),
  });
  if (!res.ok) throw new Error('tap');
  const data = await res.json();
  state.marks = roomMarks(data.marks || state.marks);
  state.others = data.others || 0;
  state.shared = data.shared !== false;
  labelCells();
  renderMarks();
}
async function loadArt() {
  const html = await fetch('experience.html', { cache: 'force-cache' }).then((res) => res.text());
  const start = html.indexOf('window.AE_EXPERIENCE_FILES=');
  const end = html.indexOf(';window.AE_EXPERIENCE_SUN=', start);
  if (start < 0 || end < 0) throw new Error('art');
  files = Function('"use strict"; return (' + html.slice(start + 'window.AE_EXPERIENCE_FILES='.length, end) + ');')();
  const board = document.getElementById('board');
  board.innerHTML = files.slice(0, 9).map((src, i) => '<button class="cell" type="button" data-i="' + i + '" aria-label="Open door ' + (i + 1) + '"><img alt="" src="' + src + '"></button>').join('');
  labelCells();
  board.querySelectorAll('.cell').forEach((cell) => {
    cell.addEventListener('click', () => tap(Number(cell.dataset.i)).catch(() => say(document.getElementById('note'), 'The light did not stay. Tap once more.', '這道光沒留下。再點一次。')));
  });
}
async function share() {
  const url = shareUrl();
  const note = document.getElementById('note');
  note.dataset.hold = '1';
  try {
    if (navigator.share) await navigator.share({ title: 'AE · ' + code, url });
    else {
      await navigator.clipboard.writeText(url);
      say(note, 'Link copied.', '連結複製了。');
    }
  } catch (error) {
    try {
      await navigator.clipboard.writeText(url);
      say(note, 'Link copied.', '連結複製了。');
    } catch (err) {
      say(note, url, url);
    }
  }
  setTimeout(() => { delete note.dataset.hold; }, 2500);
}
function boot() {
  showCodeLine();
  document.getElementById('shareBtn').addEventListener('click', share);
  document.getElementById('makeBtn').addEventListener('click', makePass);
  document.getElementById('showFigs').addEventListener('click', showFigures);
  document.getElementById('figRow').addEventListener('click', (event) => {
    const btn = event.target.closest('[data-fig]');
    if (!btn) return;
    chooseFigure(Number(btn.dataset.fig));
  });
  document.querySelector('.kofi a').addEventListener('click', () => openDoor(lastDoor));
  paintSaved();
  renderMarks();
  loadArt().then(() => { paintSaved(); renderMarks(); return pull(); }).catch(() => say(document.getElementById('note'), 'The artworks did not open.', '作品沒有打開。'));
  setInterval(() => pull().catch(() => {}), 1200);
}
document.addEventListener('DOMContentLoaded', boot);
new MutationObserver(() => renderMarks()).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
</script>
