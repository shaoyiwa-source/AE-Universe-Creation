<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AE動態桌布</title>
<meta name="description" content="匯入照片，加上會動的可愛元件、濾鏡與動態主題，做出你的 iPhone 動態桌布。">
<meta name="theme-color" content="#fcfcfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141c18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AE動態桌布">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/wallpaper/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('ae-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/wallpaper/style.css?v=3">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><img src="/wallpaper/icons/ae-rings.webp" alt="" width="52" height="26"><div class="brand-text">動態桌布<small>AE Universe Creation</small></div></div>
    <div class="top-actions">
      <button class="pill ghost" id="btnTheme" aria-label="切換深色／淺色">◐</button>
      <button class="pill ghost" id="btnUndo" aria-label="復原">↶</button>
      <button class="pill" id="btnPlay">預覽</button>
      <button class="pill primary" id="btnExport">匯出</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas" width="1080" height="2340"></canvas>
      <div class="sel-bar" id="selBar" hidden>
        <button data-sel="smaller" aria-label="縮小">－</button>
        <button data-sel="bigger" aria-label="放大">＋</button>
        <button data-sel="rotl" aria-label="左轉">⟲</button>
        <button data-sel="rotr" aria-label="右轉">⟳</button>
        <button data-sel="front" aria-label="移到最上層">⇡</button>
        <button data-sel="edit" aria-label="編輯" id="selEdit">✎</button>
        <button data-sel="delete" class="danger" aria-label="刪除">🗑</button>
      </div>
    </div>
  </main>

  <section class="panel" id="panel"></section>

  <nav class="tabbar" id="tabbar">
    <button data-tab="photo" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span>桌布</span></button>
    <button data-tab="edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg><span>編輯</span></button>
    <button data-tab="comp"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="9" cy="10.5" r=".6"/><circle cx="15" cy="10.5" r=".6"/><path d="M9.5 14.5c1.4 1.2 3.6 1.2 5 0"/></svg><span>元件</span></button>
    <button data-tab="filter"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/></svg><span>濾鏡</span></button>
    <button data-tab="theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg><span>主題</span></button>
    <button data-tab="music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span>音樂</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>設定</span></button>
  </nav>
</div>

<!-- 互動模式（全螢幕播放） -->
<div class="player" id="player" hidden>
  <canvas id="playerCanvas" width="1080" height="2340"></canvas>
  <div class="lock-clock" id="lockClock"><div class="lc-date" id="lcDate"></div><div class="lc-time" id="lcTime"></div></div>
  <button class="fab" id="fab" aria-label="AE互動按鈕"><img src="/wallpaper/icons/ae-rings.webp" alt=""></button>
  <div class="fab-menu" id="fabMenu" hidden>
    <button data-fab="theme">換主題</button>
    <button data-fab="music">音樂播放／暫停</button>
    <button data-fab="clock">鎖定畫面時鐘</button>
    <button data-fab="hide">隱藏互動按鈕</button>
    <button data-fab="exit">離開互動模式</button>
  </div>
  <div class="toast" id="playerToast"></div>
</div>

<!-- 通用對話框 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <button class="modal-x" id="modalX" aria-label="關閉">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileBase" accept="image/*" hidden>
<input type="file" id="fileSticker" accept="image/*" hidden>
<input type="file" id="fileMusic" accept="audio/*" hidden>

<script type="module" src="/wallpaper/js/app.js?v=3"></script>
</body>
</html>
