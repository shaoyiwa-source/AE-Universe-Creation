<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>夢境水晶球 · 萌創 AE OneCreator</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#d9c08a;font-family:"Cormorant Garamond","Noto Serif TC",serif;letter-spacing:.2em;transition:opacity 1.2s}
  #start .orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0,#fff0 18%),radial-gradient(circle,#ffcf7a55,#8a5cff22 55%,#0000 70%);box-shadow:0 0 60px #ffcf7a66,inset 0 0 30px #fff3;animation:br 3s ease-in-out infinite}
  #start .hp{font-size:34px;opacity:.85}
  #start .t{font-size:13px;opacity:.7}
  @keyframes br{50%{transform:scale(1.08);box-shadow:0 0 90px #ffcf7aaa,inset 0 0 30px #fff5}}
</style>
<style>
#mt{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));height:44px;padding:0 16px;border-radius:22px;border:1px solid #ffffff40;background:#ffffff14;color:#ffe3a3;font:15px/1 "Noto Sans TC",sans-serif;z-index:6;opacity:0;transition:opacity 1s}
#cm{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:none;flex-direction:column;gap:8px;align-items:center;z-index:6;font:14px/1 "Noto Sans TC",sans-serif;pointer-events:none}
#cm>div{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto;max-width:96vw}
#cm button{height:38px;min-width:44px;padding:0 12px;border-radius:19px;border:1px solid #ffffff30;background:#ffffff10;color:#f4ead8;font:inherit}
#cm button.on{background:#ffe3a3;color:#2a2010;border-color:#ffe3a3}
#cm .dot{width:38px;min-width:38px;padding:0;border:2px solid #fff}
#cm .sep{width:10px}
#cm .r3{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:0;right:0}
#ar{position:fixed;left:0;right:0;bottom:0;display:none;z-index:7;padding:14px 12px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d 18%);font:14px/1 "Noto Sans TC",sans-serif;color:#f4ead8}
#ar .h{text-align:center;color:#ffe3a3;font-size:17px;margin:4px 0 12px}#ar .h span{font-size:12px;opacity:.6;margin-left:6px}
#ar .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:0 auto 8px;max-width:560px}#ar .row b{font-weight:400;opacity:.65;width:34px;font-size:13px}
#ar button{height:38px;min-width:44px;padding:0 12px;border-radius:19px;border:1px solid #ffffff30;background:#ffffff10;color:#f4ead8;font:inherit}
#ar button.on{background:#ffe3a3;color:#2a2010;border-color:#ffe3a3}#ar .act{margin-top:12px}#ar .big{background:#ffe3a3;color:#2a2010;padding:0 18px}
#cm button.star{border-color:#ffe3a3;color:#ffe3a3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="rp" aria-label="replay" style="position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:1px solid #ffffff40;background:#ffffff12;color:#ffe3a3;font-size:22px;opacity:0;transition:opacity 1s;z-index:5">♪</button>
<button id="mt">✎ 創作</button>
<div id="cm"><div class="r1"></div><div class="r2"></div><div class="r3"></div></div>
<div id="ar"></div>
<div id="start"><div class="hp">🎧</div><div class="orb"></div><div class="t">TOUCH</div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,R,CX,CY;
const ROOTS=[196,208,220,233,247,262,277],PSC=[[0,2,4,7,9],[0,3,5,7,10],[0,2,4,7,9],[0,2,5,7,9],[0,4,7,9,11]];
const WORLDS=[...Array(35)].map((_,i)=>({img:'img/p'+String(i).padStart(2,'0')+'.jpg',scale:PSC[i%5],root:ROOTS[(i*3)%7]}));
for(let i=WORLDS.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[WORLDS[i],WORLDS[j]]=[WORLDS[j],WORLDS[i]];}
let wi=0,world=null,mask=null,mctx=null,MS=0;
let state='intro',stateT=0,progress=0,shown=0;
const parts=[],glitter=[],shards=[];
let grav={x:0,y:0.25},touched=false,hintT=0,lastTouch=null,surprise=null,nextSurprise=8;
let palette=['#ffd36b','#ff5fa8','#7dff9a','#5fb8ff','#ffffff'];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  R=Math.min(W,H)*0.42;CX=W/2;CY=H*0.47;
}
addEventListener('resize',resize);resize();

/* ---------- images ---------- */
const imgs=[];function img(i){if(!imgs[i]){const m=new Image();m.src=WORLDS[i].img;imgs[i]=m;}return imgs[i];}
function samplePalette(im){
  const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');
  x.drawImage(im,0,0,24,24);const d=x.getImageData(0,0,24,24).data;const out=[];
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(mx>120&&mx-mn>70)out.push(`rgb(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,b+40)})`);}
  return out.length>6?out:['#ffd36b','#ff5fa8','#7dff9a','#5fb8ff','#fff'];
}
function setupWorld(i){
  world=WORLDS[i];const im=img(i);img((i+1)%WORLDS.length);
  palette=samplePalette(im);if(!(im.complete&&im.naturalWidth))im.addEventListener('load',()=>{if(world===WORLDS[i])palette=samplePalette(im);},{once:true});
  MS=Math.round(Math.min(900,R*2*DPR));
  mask=document.createElement('canvas');mask.width=mask.height=MS;mctx=mask.getContext('2d');
  mctx.fillStyle='rgba(2,2,10,0.86)';mctx.fillRect(0,0,MS,MS);
  progress=0;shown=0;touched=false;hintT=0;surprise=null;nextSurprise=6+Math.random()*6;
  glitter.length=0;
  for(let k=0;k<140;k++){const a=Math.random()*6.28,r=Math.sqrt(Math.random())*R*0.95;
    glitter.push({x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,vx:0,vy:0,s:1+Math.random()*2.6,c:palette[k%palette.length],tw:Math.random()*6});}
  if(audio)startPad();
}

/* ---------- audio ---------- */
let recDest=null,audio=null,master,verb,padNodes=[];
function initAudio(){
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain();master.gain.value=0.8;
  verb=audio.createConvolver();const len=audio.sampleRate*3.2,buf=audio.createBuffer(2,len,audio.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}
  verb.buffer=buf;const wet=audio.createGain();wet.gain.value=0.55;
  master.connect(audio.destination);master.connect(verb);verb.connect(wet);wet.connect(audio.destination);
  try{recDest=audio.createMediaStreamDestination();master.connect(recDest);wet.connect(recDest);}catch(e){}
}
function note(freq,dur=1.6,vol=0.12,type='sine'){
  if(!audio)return;const t=audio.currentTime;
  const o=audio.createOscillator(),o2=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=freq;o2.type='sine';o2.frequency.value=freq*2.001;
  const g2=audio.createGain();g2.gain.value=0.25;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+dur+0.1);o2.stop(t+dur+0.1);
}
function scaleFreq(step){const s=world.scale,oct=Math.floor(step/s.length),k=((step%s.length)+s.length)%s.length;
  return world.root*Math.pow(2,oct+s[k]/12);}
let lastNote=0;const melody=[];let mStart=0;
function strokeNote(y){const now=performance.now();if(now-lastNote<85)return;lastNote=now;
  const step=Math.round((1-(y-(CY-R))/(2*R))*10);const f=scaleFreq(Math.max(0,step));note(f,1.8,0.09,'triangle');
  const t=audio.currentTime;if(!melody.length||t-melody[melody.length-1].t>4){melody.length=0;}melody.push({t,f});if(melody.length>64)melody.shift();showReplay();}
function chord(){[0,2,4,7,9].forEach((s,i)=>setTimeout(()=>note(scaleFreq(s),3.5,0.1),i*90));}
function chime(){[7,9,11,14].forEach((s,i)=>setTimeout(()=>note(scaleFreq(s),1.2,0.08),i*60));}
function startPad(){
  padNodes.forEach(n=>{try{n.g.gain.setTargetAtTime(0,audio.currentTime,0.8);n.o.stop(audio.currentTime+3);}catch(e){}});padNodes=[];
  const f=world.root/2;
  [f,f*1.5,f*2.0035].forEach((fr,i)=>{
    const o=audio.createOscillator(),g=audio.createGain(),lp=audio.createBiquadFilter();
    o.type=i==1?'triangle':'sine';o.frequency.value=fr;lp.type='lowpass';lp.frequency.value=900;
    const lfo=audio.createOscillator(),lg=audio.createGain();lfo.frequency.value=0.07+i*0.03;lg.gain.value=0.012;
    lfo.connect(lg);lg.connect(g.gain);g.gain.value=0;g.gain.setTargetAtTime(0.028,audio.currentTime,2);
    o.connect(lp);lp.connect(g);g.connect(master);o.start();lfo.start();padNodes.push({o,g});
  });
}

let replaying=false;
function showReplay(){const b=document.getElementById('rp');if(b&&melody.length>=6)b.style.opacity=1;}
function replay(){if(replaying||melody.length<2)return;replaying=true;const t0=melody[0].t;let acc=0,prev=t0;const now=audio.currentTime+0.1;
  melody.forEach((m,i)=>{acc+=Math.min(0.6,m.t-prev);prev=m.t;setTimeout(()=>{note(m.f,2,0.1,'triangle');const a=Math.random()*6.28,r=Math.random()*R*0.7;sparkle(CX+Math.cos(a)*r,CY+Math.sin(a)*r,6,3);},acc*1000);});
  setTimeout(()=>replaying=false,acc*1000+400);}
/* ---------- blow (mic) ---------- */
let an=null,abuf=null,blowT=0;
async function initMic(){try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const src=audio.createMediaStreamSource(st);an=audio.createAnalyser();an.fftSize=1024;src.connect(an);abuf=new Uint8Array(an.frequencyBinCount);}catch(e){}}
function checkBlow(){if(!an||state!=='play')return;an.getByteFrequencyData(abuf);let lo=0,hi=0;for(let i=1;i<12;i++)lo+=abuf[i];for(let i=60;i<200;i++)hi+=abuf[i];lo/=11;hi/=140;
  if(lo>150&&hi>70){blowT+=1;glitter.forEach(g=>{const dx=g.x-CX,dy=g.y-CY,d=Math.hypot(dx,dy)+1;g.vx+=dx/d*0.9+(Math.random()-.5);g.vy+=dy/d*0.9+(Math.random()-.5);});
    if(blowT%4===0){const a=Math.random()*6.28,r=Math.random()*R*0.85,x=CX+Math.cos(a)*r,y=CY+Math.sin(a)*r;reveal(x,y,R*0.1);sparkle(x,y,5,3);touched=true;}
    if(blowT%14===0)note(scaleFreq(5+((Math.random()*5)|0)),2.4,0.05);}else blowT=0;}
/* ---------- input ---------- */
function inBall(x,y){return Math.hypot(x-CX,y-CY)<R;}
function reveal(x,y,rad){
  const s=MS/(2*R),mx=(x-(CX-R))*s,my=(y-(CY-R))*s,rr=rad*s;
  mctx.globalCompositeOperation='destination-out';
  const g=mctx.createRadialGradient(mx,my,0,mx,my,rr);g.addColorStop(0,'rgba(0,0,0,0.9)');g.addColorStop(1,'rgba(0,0,0,0)');
  mctx.fillStyle=g;mctx.beginPath();mctx.arc(mx,my,rr,0,6.29);mctx.fill();mctx.globalCompositeOperation='source-over';
}
function sparkle(x,y,n,spd=2.5,big=false){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*spd;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.3,life:1,dec:0.012+Math.random()*0.02,s:big?2+Math.random()*4:1+Math.random()*2.5,c:palette[(Math.random()*palette.length)|0],star:Math.random()<0.35});}
}
function pointer(x,y,first){
  if(state!=='play')return;
  if(surprise&&Math.hypot(x-surprise.x,y-surprise.y)<34){popSurprise();return;}
  if(!inBall(x,y))return;
  const rad=R*0.16;
  if(lastTouch&&!first){const dx=x-lastTouch.x,dy=y-lastTouch.y,d=Math.hypot(dx,dy),n=Math.ceil(d/(rad*0.3));
    for(let i=1;i<=n;i++)reveal(lastTouch.x+dx*i/n,lastTouch.y+dy*i/n,rad);
    glitter.forEach(g=>{const dd=Math.hypot(g.x-x,g.y-y);if(dd<70){g.vx+=dx*0.08;g.vy+=dy*0.08;}});
  }else reveal(x,y,rad);
  touched=true;sparkle(x,y,4);strokeNote(y);lastTouch={x,y};
}
function onOrient(e){if(e.gamma==null)return;grav.x=Math.max(-1,Math.min(1,e.gamma/45))*0.35;grav.y=Math.max(-1,Math.min(1,(e.beta-35)/45))*0.35;}
let lastShake=0;
function onMotion(e){const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;
  const m=Math.hypot(a.x||0,a.y||0,a.z||0),now=performance.now();
  if(m>24&&now-lastShake>500&&state==='play'){lastShake=now;
    glitter.forEach(g=>{g.vx+=(Math.random()-.5)*14;g.vy+=(Math.random()-.5)*14;});
    for(let k=0;k<5;k++){const a2=Math.random()*6.28,r=Math.random()*R*0.8;const x=CX+Math.cos(a2)*r,y=CY+Math.sin(a2)*r;reveal(x,y,R*0.12);sparkle(x,y,8,4);}
    chime();}
}

/* ---------- surprise ---------- */
function spawnSurprise(){const a=Math.random()*6.28,r=Math.random()*R*0.65;surprise={x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,t:0};}
function popSurprise(){
  const {x,y}=surprise;surprise=null;nextSurprise=9+Math.random()*8;
  for(let k=0;k<14;k++){const a=k/14*6.28;reveal(x+Math.cos(a)*R*0.12,y+Math.sin(a)*R*0.12,R*0.2);}
  reveal(x,y,R*0.3);sparkle(x,y,60,6,true);
  for(let k=0;k<18;k++){const a=Math.random()*6.28,v=3+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,life:1,dec:0.01,s:5,c:'#ffd36b',coin:true,g:0.18});}
  [0,4,7,12,16].forEach((s,i)=>setTimeout(()=>note(world.root*2*Math.pow(2,s/12),1.4,0.09),i*70));
}

/* ---------- progress ---------- */
const pc=document.createElement('canvas');pc.width=pc.height=40;const pctx=pc.getContext('2d',{willReadFrequently:true});
function measure(){
  pctx.clearRect(0,0,40,40);pctx.drawImage(mask,0,0,40,40);const d=pctx.getImageData(0,0,40,40).data;
  let tot=0,clear=0;for(let y=0;y<40;y++)for(let x=0;x<40;x++){if(Math.hypot(x-19.5,y-19.5)>19)continue;tot++;clear+=1-d[(y*40+x)*4+3]/240;}
  progress=Math.max(0,Math.min(1,clear/tot));
}

/* ---------- drawing ---------- */
const bgStars=Array.from({length:120},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.4,p:Math.random()*6}));
function drawBall(t,zoom=1,maskAlpha=1,glow=0){
  const im=img(wi),r=R*zoom;
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,r,0,6.29);ctx.clip();
  const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;
  const breathe=1+Math.sin(t*0.6)*0.012;
  ctx.drawImage(im,sx,sy,s,s,CX-r*breathe,CY-r*breathe,2*r*breathe,2*r*breathe);
  if(glow>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=glow*0.5;ctx.drawImage(im,sx,sy,s,s,CX-r,CY-r,2*r,2*r);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  if(maskAlpha>0){ctx.globalAlpha=maskAlpha;ctx.drawImage(mask,CX-r,CY-r,2*r,2*r);ctx.globalAlpha=1;}
  // glitter inside
  for(const g of glitter){const tw=0.5+0.5*Math.sin(t*4+g.tw);ctx.globalAlpha=0.5+tw*0.5;ctx.fillStyle=g.c;
    ctx.beginPath();ctx.arc(CX+(g.x-CX)*zoom,CY+(g.y-CY)*zoom,g.s*(0.7+tw*0.5),0,6.29);ctx.fill();}
  ctx.globalAlpha=1;
  // glass shading
  const sh=ctx.createRadialGradient(CX,CY,r*0.55,CX,CY,r);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,20,0.45)');
  ctx.fillStyle=sh;ctx.fillRect(CX-r,CY-r,2*r,2*r);
  const hl=ctx.createRadialGradient(CX-r*0.38,CY-r*0.45,0,CX-r*0.38,CY-r*0.45,r*0.5);hl.addColorStop(0,'rgba(255,255,255,0.38)');hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;ctx.fillRect(CX-r,CY-r,2*r,2*r);
  ctx.restore();
  // rim
  ctx.save();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,240,210,0.35)';ctx.shadowColor=palette[0];ctx.shadowBlur=30+20*Math.sin(t*1.3);
  ctx.beginPath();ctx.arc(CX,CY,r,0,6.29);ctx.stroke();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(CX,CY,r*0.93,Math.PI*1.08,Math.PI*1.42);ctx.stroke();ctx.restore();
}
function drawProgress(t){
  if(state!=='play')return;
  ctx.save();ctx.lineWidth=3;ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.beginPath();ctx.arc(CX,CY,R+16,0,6.29);ctx.stroke();
  const goal=0.72,p=Math.min(1,shown/goal);
  const gr=ctx.createLinearGradient(CX-R,CY-R,CX+R,CY+R);palette.slice(0,4).forEach((c,i)=>gr.addColorStop(i/3,c));
  ctx.strokeStyle=gr;ctx.shadowColor='#fff';ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(CX,CY,R+16,-Math.PI/2,-Math.PI/2+p*6.283);ctx.stroke();ctx.restore();
  ctx.fillStyle='rgba(255,227,163,0.6)';ctx.font='12px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.fillText((wi+1)+' / '+WORLDS.length,W/2,CY+R+50);
}
function drawSurprise(t){
  if(!surprise)return;surprise.t+=1/60;const {x,y}=surprise,p=Math.min(1,surprise.t*2);
  const b=1+Math.sin(t*6)*0.15;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*2)*0.3);ctx.scale(p*b,p*b);
  ctx.shadowColor='#ffd36b';ctx.shadowBlur=30;ctx.fillStyle='#ffe08a';star(0,0,16,7,5);ctx.fill();ctx.restore();
  if(surprise.t>9){surprise=null;nextSurprise=5+Math.random()*6;}
}
function star(x,y,r1,r2,n){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n-Math.PI/2;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}
function drawParts(){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0.02;p.vx*=0.985;p.life-=p.dec;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
    if(p.coin){ctx.save();ctx.translate(p.x,p.y);ctx.scale(Math.cos(p.life*20),1);ctx.shadowColor='#ffd36b';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,p.s,0,6.29);ctx.fill();ctx.restore();}
    else if(p.star){star(p.x,p.y,p.s*2,p.s*0.7,4);ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.29);ctx.fill();}
  }ctx.globalAlpha=1;
}
function updateGlitter(){
  for(const g of glitter){g.vx+=grav.x*0.12;g.vy+=grav.y*0.12;g.vx*=0.96;g.vy*=0.96;g.x+=g.vx;g.y+=g.vy;
    const dx=g.x-CX,dy=g.y-CY,d=Math.hypot(dx,dy),lim=R*0.96-g.s;
    if(d>lim){const nx=dx/d,ny=dy/d;g.x=CX+nx*lim;g.y=CY+ny*lim;const dot=g.vx*nx+g.vy*ny;g.vx-=1.6*dot*nx;g.vy-=1.6*dot*ny;}}
}

/* ---------- finale ---------- */
function startFinale(){state='finale';stateT=0;chord();

  <div class="row act"><button data-a="play" class="big">${AR.playing?'■ 停止':'▶ 播放整首'}</button><button data-a="dice">🎲 換個編排</button><button data-a="rec">${AR.rec?'錄製中…':'⤓ 存影片'}</button><button data-a="midi">⤓ 存樂譜</button><button data-a="close">✕</button></div>`;}
arEl.addEventListener('pointerdown',e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,v=b.dataset.v,was=AR.playing;
  if(a==='inst'||a==='scale'||a==='tempo'){AR[a]=v;AR.song=null;if(was){arStop();arPlay();}}
  else if(a==='layer'){AR.layers[v]=AR.layers[v]?0:1;AR.song=null;if(was){arStop();arPlay();}}
  else if(a==='dice'){AR.seed++;AR.song=null;arStop();arPlay();}
  else if(a==='play'){if(AR.playing)arStop();else arPlay();}
  else if(a==='rec'){if(!AR.rec){arStop();arRecord();}}
  else if(a==='midi')arMidi();
  else if(a==='close'){arStop();arEl.style.display='none';state='create';ui.style.display='flex';mt.style.display='';loadCM();setBtns();return;}
  arBtns();});
function openAR(){const n=CM.strokes.reduce((a,s)=>a+s.pts.filter(p=>p.n).length,0);if(n<4){toast('先畫長一點（至少 4 個音），再按自動編曲');return;}
  cmStop();AR.inst=CM.inst;AR.scale=CM.scale;AR.song=null;state='song';ui.style.display='none';mt.style.display='none';arEl.style.display='block';arBtns();arPlay();}
function drawSong(t){const pl=arPulse(t);const r=R*(1+pl*0.015),im=img(wi),s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2,cy=CY-H*0.12;
  ctx.save();ctx.beginPath();ctx.arc(CX,cy,r,0,6.29);ctx.clip();ctx.drawImage(im,sx,sy,s,s,CX-r,cy-r,2*r,2*r);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.7+pl*0.3;ctx.drawImage(light,CX-r,cy-r,2*r,2*r);ctx.globalAlpha=pl*0.25;ctx.drawImage(im,sx,sy,s,s,CX-r,cy-r,2*r,2*r);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  lctx.globalCompositeOperation='destination-out';lctx.fillStyle='rgba(0,0,0,0.012)';lctx.fillRect(0,0,LS,LS);lctx.globalCompositeOperation='source-over';
  ctx.restore();ctx.save();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,240,210,0.45)';ctx.shadowColor=palette[0];ctx.shadowBlur=30+pl*40;ctx.beginPath();ctx.arc(CX,cy,r,0,6.29);ctx.stroke();ctx.restore();}
/* ================= GALLERY（看全圖） ================= */
function drawGallery(T){const im=img(wi),k=Math.min(1,T/1.2),mw=W*0.9,mh=H*0.72,sc=Math.min(mw/im.width,mh/im.height)*(1+T*0.008),w=im.width*sc,h=im.height*sc,x=(W-w)/2,y=(H-h)/2-H*0.03;
  ctx.save();ctx.globalAlpha=k;ctx.shadowColor=palette[1];ctx.shadowBlur=60;ctx.fillStyle='#000';ctx.fillRect(x,y,w,h);ctx.shadowBlur=0;ctx.drawImage(im,x,y,w,h);
  ctx.strokeStyle='rgba(255,230,180,0.5)';ctx.lineWidth=1.5;ctx.strokeRect(x-6,y-6,w+12,h+12);ctx.restore();
  if(T>1.5){ctx.globalAlpha=Math.min(1,(T-1.5));ctx.fillStyle='#ffe3a3';ctx.font='14px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.fillText('點一下，前往下一個世界',W/2,y+h+40);ctx.globalAlpha=1;}}

function nextWorld(){wi=(wi+1)%WORLDS.length;setupWorld(wi);state='enter';stateT=0;}
/* ---------- start ---------- */
const st=document.getElementById('start');
st.addEventListener('pointerdown',async()=>{
  initAudio();initMic();
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();}}catch(e){}
  try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){await DeviceMotionEvent.requestPermission();}}catch(e){}
  addEventListener('deviceorientation',onOrient);addEventListener('devicemotion',onMotion);
  st.style.opacity=0;setTimeout(()=>st.remove(),1200);
  const go=()=>{setupWorld(0);state='enter';stateT=0;};
  const m0=img(0);if(m0.complete&&m0.naturalWidth)go();else m0.onload=go;
},{once:true});
document.getElementById('rp').addEventListener('pointerdown',e=>{e.stopPropagation();replay();});
requestAnimationFrame(frame);
})();
</script>
