<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="robots" content="noindex">
<title>光紋萬花筒 · 測試版 · 萌創</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
  :root{--fg:#f4f0ff;--dim:rgba(244,240,255,.62)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#07060d;color:var(--fg);overflow:hidden;font:15px/1.5 "PingFang TC","Noto Sans TC",system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hint{position:fixed;left:0;right:0;top:calc(18px + env(safe-area-inset-top));text-align:center;font-size:15px;letter-spacing:.12em;color:var(--dim);text-shadow:0 0 12px #000;pointer-events:none;transition:opacity .6s}
  #credit{position:fixed;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:11px;letter-spacing:.08em;color:rgba(244,240,255,.45);pointer-events:none}
  #picker{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;padding:0 12px;overflow-x:auto;transition:opacity .5s,transform .5s}
  #picker button{flex:none;width:54px;height:54px;border-radius:14px;border:2px solid rgba(255,255,255,.18);padding:0;background:#222 center/cover;cursor:pointer;transition:transform .2s,border-color .2s}
  #picker button.on{border-color:#fff;transform:translateY(-4px)}
  #bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(14,10,28,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .5s,transform .5s}
  #bar.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  #bar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:7px 6px;border:0;border-radius:16px;background:transparent;color:var(--fg);font:inherit;font-size:11px;cursor:pointer}
  #bar button:hover{background:rgba(255,255,255,.1)}
  #bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .hide{opacity:0!important;pointer-events:none!important}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:999px;background:rgba(14,10,28,.75);font-size:14px;opacity:0;pointer-events:none;transition:opacity .4s}
  #toast.on{opacity:1}
  #start{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at center,rgba(40,20,70,.55),rgba(7,6,13,.92));cursor:pointer;transition:opacity .8s}
  #start h1{margin:0 0 6px;font-weight:600;font-size:clamp(28px,7vw,44px);letter-spacing:.18em}
  #start p{margin:0;color:var(--dim);letter-spacing:.14em}
  #start small{display:block;margin-top:26px;font-size:12px;color:rgba(244,240,255,.4);letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">選一幅畫，用手指畫一條光</div>
<div id="picker"></div>
<div id="bar">
  <button id="bMore"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>再畫一條</button>
  <button id="bNew"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>重新來</button>
  <button id="bPic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/></svg>存圖</button>
  <button id="bVid"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>錄 8 秒</button>
</div>
<div id="credit"></div>
<div id="toast"></div>
<div id="start"><div><h1>光紋萬花筒</h1><p>用你的一筆，讓畫綻開</p><small>輕觸開始 · 戴耳機更好聽</small></div></div>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); pattern=null; if(state==='draw') drawBase(); }
addEventListener('resize',resize);

/* ── 畫作（材料）── */
const ARTS=[
  {f:'p28',n:'Infinity Nature'},{f:'p33',n:'Nature Core'},{f:'p31',n:'Nature Flow'},{f:'p32',n:'Love Spin'},
  {f:'p34',n:'Life Flow'},{f:'p29',n:'Abundant Number'},{f:'p16',n:''},{f:'p26',n:''},{f:'p15',n:''},{f:'p09',n:''}
];
const src=a=>`../../globe/img/${a.f}.jpg`;
let art=null, img=null, sampler=null, sctx=null;
function loadArt(a){
  art=a; $('#credit').textContent=`材料取自${a.n?'《'+a.n+'》':'畫作'}・13th Aurelia`;
  const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>{ img=im; sampler=document.createElement('canvas'); sampler.width=im.naturalWidth; sampler.height=im.naturalHeight; sctx=sampler.getContext('2d',{willReadFrequently:true}); sctx.drawImage(im,0,0); if(state!=='bloom') drawBase(); }; im.src=src(a);
  document.querySelectorAll('#picker button').forEach(b=>b.classList.toggle('on',b.dataset.f===a.f));
}
$('#picker').innerHTML=ARTS.map(a=>`<button data-f="${a.f}" style="background-image:url(${src(a)})" aria-label="${a.n||'畫作'}"></button>`).join('');
document.querySelectorAll('#picker button').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const a=ARTS.find(x=>x.f===b.dataset.f); if(state==='bloom'){ resetAll(); } loadArt(a); });

/* painting is drawn "cover" — map screen point → image pixel */
function coverRect(){ const iw=img.naturalWidth, ih=img.naturalHeight, s=Math.max(W/iw,H/ih); return {s, x:(W-iw*s)/2, y:(H-ih*s)/2, w:iw*s, h:ih*s}; }
function sampleAt(x,y){
  if(!sctx) return [255,240,200];
  const r=coverRect(); const ix=Math.max(0,Math.min(img.naturalWidth-3,(x-r.x)/r.s|0)), iy=Math.max(0,Math.min(img.naturalHeight-3,(y-r.y)/r.s|0));
  const d=sctx.getImageData(ix,iy,3,3).data; let R=0,G=0,B=0; for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];}
  return boost([R/9,G/9,B/9]);
}
/* make sampled colour glow: raise saturation & lightness */
function boost([r,g,b]){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2; const d=mx-mn;
  if(d){ s=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?(b-r)/d+2:(r-g)/d+4; h/=6; }
  s=Math.min(1,s*1.35+.15); l=Math.min(.72,Math.max(.52,l*1.1));
  return [h*360,s*100,l*100]; }
const hsl=(c,a=1)=>`hsla(${c[0]|0},${c[1]|0}%,${c[2]|0}%,${a})`;

function drawBase(){
  ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#07060d'; ctx.fillRect(0,0,W,H);
  if(!img) return; const r=coverRect(); ctx.globalAlpha=.82; ctx.drawImage(img,r.x,r.y,r.w,r.h); ctx.globalAlpha=1;
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75); g.addColorStop(0,'rgba(7,6,13,0)'); g.addColorStop(1,'rgba(7,6,13,.7)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const s of strokes) drawStrokeFlat(s);
}

/* ── 聲音 ── */
let AC=null, master=null, verb=null, dest=null;
function audio(){
  if(AC) return; AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.55; dest=AC.createMediaStreamDestination();
  verb=AC.createConvolver(); const len=AC.sampleRate*3.2, buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); } verb.buffer=buf;
  const wet=AC.createGain(); wet.gain.value=.55; verb.connect(wet); wet.connect(master); master.connect(AC.destination); master.connect(dest);
}
const SCALE=[0,2,4,7,9,12,14,16,19,21,24];
function note(y,vel=.12,dur=1.6,type='sine'){
  if(!AC) return; const i=Math.max(0,Math.min(SCALE.length-1,Math.round((1-y/H)*(SCALE.length-1))));
  const f=261.63*Math.pow(2,SCALE[i]/12), t=AC.currentTime;
  [1,2].forEach((m,k)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=k?'sine':type; o.frequency.value=f*m; o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel/(k?4:1),t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(master); g.connect(verb); o.start(t); o.stop(t+dur+.05); });
}
function chord(){ if(!AC) return; [0,4,7,11,14].forEach((s,k)=>setTimeout(()=>{ const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=196*Math.pow(2,s/12);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.4); g.gain.exponentialRampToValueAtTime(.0001,t+4.5); o.connect(g); g.connect(master); g.connect(verb); o.start(t); o.stop(t+4.6); },k*110)); }

/* ── 畫光紋 ── */
let state='intro', strokes=[], cur=null, lastNote=0, speedSum=0;
function drawStrokeFlat(s){ ctx.globalCompositeOperation='lighter'; for(let i=1;i<s.pts.length;i++) seg(ctx,s.pts[i-1],s.pts[i],1); ctx.globalCompositeOperation='source-over'; }
function seg(c,a,b,k){ c.strokeStyle=hsl(b.c,.16*k); c.lineWidth=16*k; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke();
  c.strokeStyle=hsl(b.c,.6*k); c.lineWidth=5*k; c.stroke(); c.strokeStyle=hsl([b.c[0],b.c[1]*.6,92],.55*k); c.lineWidth=1.3*k; c.stroke(); }
cv.addEventListener('pointerdown',e=>{
  if(state==='intro') return;
  if(state==='bloom' && !adding) return;
  cv.setPointerCapture(e.pointerId); cur={pts:[{x:e.clientX,y:e.clientY,c:sampleAt(e.clientX,e.clientY),t:performance.now()}]}; strokes.push(cur);
  $('#hint').classList.add('hide'); $('#picker').classList.add('hide'); $('#bar').classList.remove('on');
  if(state==='bloom'){ state='draw2'; }
});
cv.addEventListener('pointermove',e=>{
  if(!cur) return; const p=cur.pts[cur.pts.length-1], x=e.clientX, y=e.clientY, d=Math.hypot(x-p.x,y-p.y); if(d<3) return;
  const q={x,y,c:sampleAt(x,y),t:performance.now()}; cur.pts.push(q); speedSum+=d/Math.max(1,q.t-p.t);
  ctx.globalCompositeOperation='lighter'; seg(ctx,p,q,1); ctx.globalCompositeOperation='source-over';
  sparks.push({x,y,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2-0.4,l:1,c:q.c});
  const now=performance.now(); if(now-lastNote>110){ lastNote=now; note(y,.09,1.4); }
});
const end=e=>{ if(!cur) return; const s=cur; cur=null; if(s.pts.length<6){ strokes.pop(); if(state==='draw2') state='bloom'; return; } bloom(); };
cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);

/* ── 綻開成萬花筒 ── */
let pattern=null, N=8, spin=0, spinV=.002, bloomT=0, adding=false, sparks=[];
function bloom(){
  const all=strokes.flatMap(s=>s.pts); let len=0; for(const s of strokes) for(let i=1;i<s.pts.length;i++) len+=Math.hypot(s.pts[i].x-s.pts[i-1].x,s.pts[i].y-s.pts[i-1].y);
  /* 線越曲折、瓣越多；畫越快轉越快 */
  let turn=0; for(const s of strokes) for(let i=2;i<s.pts.length;i++){ const a=Math.atan2(s.pts[i-1].y-s.pts[i-2].y,s.pts[i-1].x-s.pts[i-2].x), b=Math.atan2(s.pts[i].y-s.pts[i-1].y,s.pts[i].x-s.pts[i-1].x); let d=Math.abs(b-a); if(d>Math.PI) d=2*Math.PI-d; turn+=d; }
  N=[6,8,10,12][Math.min(3,Math.floor(turn/len*60))]||8;
  const avgSpeed=speedSum/Math.max(1,all.length); spinV=Math.min(.012,.0015+avgSpeed*.0022);
  pattern=null; state='bloom'; adding=false; bloomT=performance.now(); chord();
  setTimeout(()=>{ if(state==='bloom') $('#bar').classList.add('on'); },1600);
}
function buildPattern(){
  const R=Math.hypot(W,H)/2+40, S=Math.ceil(R*2), pc=document.createElement('canvas'); pc.width=pc.height=S*DPR; const p=pc.getContext('2d'); p.setTransform(DPR,0,0,DPR,0,0);
  p.translate(S/2,S/2); p.globalCompositeOperation='lighter'; p.lineCap=p.lineJoin='round';
  const cx=W/2, cy=H/2;
  for(let k=0;k<N;k++){ for(const m of [1,-1]){ p.save(); p.rotate(k*2*Math.PI/N); p.scale(1,m);
    for(const s of strokes) for(let i=1;i<s.pts.length;i++){ const a=s.pts[i-1], b=s.pts[i]; seg(p,{x:a.x-cx,y:a.y-cy},{x:b.x-cx,y:b.y-cy,c:b.c},.62); }
    p.restore(); } }
  const gc=document.createElement('canvas'); gc.width=gc.height=Math.ceil(S/3); const g=gc.getContext('2d'); g.filter='blur(6px)'; g.drawImage(pc,0,0,gc.width,gc.height);
  let haze=null; if(img){ haze=document.createElement('canvas'); haze.width=Math.ceil(W/4); haze.height=Math.ceil(H/4); const h=haze.getContext('2d'); h.filter='blur(10px) saturate(1.4)'; const r=coverRect(); h.drawImage(img,r.x/4,r.y/4,r.w/4,r.h/4); }
  return {c:pc,g:gc,S,haze};
}
function frame(now){
  requestAnimationFrame(frame);
  if(state==='bloom'||state==='draw2'){
    if(!pattern) pattern=buildPattern();
    const k=Math.min(1,(now-bloomT)/2200), ease=1-Math.pow(1-k,3);
    ctx.globalCompositeOperation='source-over'; ctx.fillStyle=`rgba(7,6,13,${state==='draw2'?.12:.22})`; ctx.fillRect(0,0,W,H);
    if(img && k<1){ const r=coverRect(); ctx.globalAlpha=(1-ease)*.5; ctx.drawImage(img,r.x,r.y,r.w,r.h); ctx.globalAlpha=1; }
    if(pattern.haze){ ctx.globalAlpha=.05+.02*Math.sin(now/2300); ctx.drawImage(pattern.haze,0,0,W,H); ctx.globalAlpha=1; }
    spin+=spinV; const breathe=1+Math.sin(now/1600)*.035;
    ctx.save(); ctx.translate(W/2,H/2); ctx.globalCompositeOperation='lighter';
    for(const [sc,al,dir] of [[ease*breathe,.9,1],[ease*breathe*.55,.45,-1.6]]){ ctx.save(); ctx.rotate(spin*dir); ctx.scale(sc,sc); ctx.globalAlpha=al*(.55+.2*Math.sin(now/1100)); ctx.drawImage(pattern.g,-pattern.S/2,-pattern.S/2,pattern.S,pattern.S); ctx.globalAlpha=al; ctx.drawImage(pattern.c,-pattern.S/2,-pattern.S/2,pattern.S,pattern.S); ctx.restore(); }
    ctx.restore(); ctx.globalAlpha=1;
    if(state==='draw2') for(const s of strokes) if(s===cur) drawStrokeFlat(s);
    if(Math.random()<.35){ const s=strokes[Math.random()*strokes.length|0], q=s.pts[Math.random()*s.pts.length|0], a=Math.random()*Math.PI*2, d=Math.hypot(q.x-W/2,q.y-H/2)*ease; sparks.push({x:W/2+Math.cos(a)*d,y:H/2+Math.sin(a)*d,vx:Math.cos(a)*.3,vy:Math.sin(a)*.3,l:1,c:q.c}); }
  }
  if(sparks.length){ ctx.globalCompositeOperation='lighter'; for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.x+=s.vx; s.y+=s.vy; s.l-=.018; if(s.l<=0){ sparks.splice(i,1); continue; } ctx.fillStyle=hsl(s.c,s.l*.9); ctx.beginPath(); ctx.arc(s.x,s.y,1.4+s.l*1.6,0,7); ctx.fill(); } ctx.globalCompositeOperation='source-over'; }
}
requestAnimationFrame(frame);

function resetAll(){ strokes=[]; cur=null; pattern=null; sparks=[]; speedSum=0; spin=0; state='draw'; adding=false; $('#bar').classList.remove('on'); $('#picker').classList.remove('hide'); $('#hint').classList.remove('hide'); $('#hint').textContent='選一幅畫，用手指畫一條光'; drawBase(); }
$('#bNew').onclick=resetAll;
$('#bMore').onclick=()=>{ adding=true; $('#bar').classList.remove('on'); $('#hint').textContent='再畫一條，它會加進萬花筒'; $('#hint').classList.remove('hide'); };

function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1800); }
async function shareFile(blob,name){ const file=new File([blob],name,{type:blob.type}); try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; } }catch(e){ return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('已存檔'); }
function stampCredit(c,w,h){ c.save(); c.globalCompositeOperation='source-over'; c.font='12px "PingFang TC",sans-serif'; c.fillStyle='rgba(244,240,255,.55)'; c.textAlign='right'; c.fillText($('#credit').textContent,w-16,h-14); c.restore(); }
$('#bPic').onclick=()=>{ const o=document.createElement('canvas'); o.width=cv.width; o.height=cv.height; const c=o.getContext('2d'); c.drawImage(cv,0,0); c.scale(DPR,DPR); stampCredit(c,W,H); o.toBlob(b=>b&&shareFile(b,'光紋萬花筒.png'),'image/png'); };
$('#bVid').onclick=()=>{
  if(!window.MediaRecorder||!cv.captureStream){ toast('這個瀏覽器不能錄影，可以先存圖'); return; }
  const st=cv.captureStream(30); if(dest) dest.stream.getAudioTracks().forEach(t=>st.addTrack(t));
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm']; const type=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(st,type?{mimeType:type,videoBitsPerSecond:6e6}:{}), parts=[]; rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  rec.onstop=()=>{ const b=new Blob(parts,{type:rec.mimeType||'video/webm'}); shareFile(b,'光紋萬花筒.'+(/mp4/.test(b.type)?'mp4':'webm')); $('#bar').classList.add('on'); };
  $('#bar').classList.remove('on'); toast('錄影中 8 秒…'); chord(); rec.start(); setTimeout(()=>rec.stop(),8000);
};


$('#start').onclick=()=>{ audio(); if(AC.state==='suspended') AC.resume(); $('#start').style.opacity=0; setTimeout(()=>$('#start').remove(),800); state='draw'; drawBase(); };
resize(); loadArt(ARTS[0]);
</script>
</body>
</html>
