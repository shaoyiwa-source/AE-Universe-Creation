# AE動態桌布 iOS App — 用 XcodeGen 產生 Xcode 專案：brew install xcodegen && xcodegen generate
name: AEWallpaper
options:
  bundleIdPrefix: com.aeuniverse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 在 Xcode 的 Signing & Capabilities 選你的 Apple 開發者團隊
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AEWallpaper:
    type: application
    platform: iOS
    sources:
      - path: AEWallpaper
      - path: Shared
    info:
      path: AEWallpaper/Info.plist
      properties:
        CFBundleDisplayName: AE動態桌布
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 將你做好的桌布、影片與原況照片存到「照片」。
        NSPhotoLibraryUsageDescription: 選擇照片作為桌布底圖或可愛貼圖。
        LSApplicationQueriesSchemes: [shortcuts]
        UIAppFonts: [CormorantGaramond-Medium.ttf, CormorantGaramond-SemiBold.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: com.aeuniverse.wallpaper
            CFBundleURLSchemes: [aewallpaper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeuniverse.wallpaper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AEControls
  AEControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AEControls
      - path: Shared
    info:
      path: AEControls/Info.plist
      properties:
        CFBundleDisplayName: AE互動
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeuniverse.wallpaper.controls
schemes:
  AEWallpaper:
    build:
      targets:
        AEWallpaper: all
        AEControls: all
    run:
      config: Debug
    archive:
      config: Release
